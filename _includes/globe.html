<div style="width: 100%; height: 0; padding-top: 100%; position: relative;" class="no-select">
  <div
    id="{{ include.id | default: 'globeViz' }}"
    style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"
  ></div>
  <div style="position: absolute; bottom: 0px; right: 0px; display: flex; flex-direction: column; gap: 10px; z-index: 10;">
    <button id="zoom-in" style="width: 30px; height: 30px; font-size: 18px; cursor: pointer;">+</button>
    <button id="zoom-out" style="width: 30px; height: 30px; font-size: 18px; cursor: pointer;">−</button>
  </div>
</div>

<script src="//cdn.jsdelivr.net/npm/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="{{ '/assets/js/globe.js' | bust_cache | relative_url }}"></script>
