{% assign images = site.static_files | where_exp: 'file', 'file.path contains include.folder' | map: 'basename' %}
<div
  class="slider-container"
  style="--slide-width: {{ include.slide-width | default: '320px' }}; --slide-duration: {{ include.slide-duration | default: '10s' }}; --slide-count: {{ images.size }}"
  data-images="{{ images | join: '|' }}"
></div>
<link rel="stylesheet" href="{{ '/assets/css/slider.css' | relative_url }}">
