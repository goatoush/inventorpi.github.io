<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}" />
{% for lang in site.languages offset: 1 %}
  <link
    rel="alternate"
    hreflang="{{ lang.code }}"
    href="{{ page.url | prepend: lang.code | prepend: '/' | absolute_url }}"
  />
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}" />
{% for lang in site.languages offset: 1 %}
  <meta property="og:locale:alternate" content="{{ lang.code }}" />
{% endfor %}

{% if page.noindex %}
  <meta name="robots" content="noindex, nofollow">
{% endif %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-00FD6QB7EM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag('js', new Date());

  gtag('config', 'G-00FD6QB7EM');
</script>
<script>
  const BRAND_COLOR = '{{ site.brand_color }}';
  const i18nText = JSON.parse(`{{ site.i18n_text | jsonify | default: [] }}`);
  const i18n = (text) => i18nText[text] || text;
  const searchDataPath = '/assets/js/search-data.json';
  const citiesDataPath = '/assets/data/cities.json';
  const languages = [{%- for l in site.languages -%}{c:"{{l.code}}",l:"{{l.label_en}}"},{%- endfor -%}];
</script>
<script src="{{ '/assets/js/main.js' | bust_cache | relative_url }}" defer></script>
<link
  rel="preload"
  href="{{ '/assets/css/styles.css' | relative_url }}"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</noscript>
<link rel="alternate-stylesheet" href="{{ '/assets/css/rtl.css' | relative_url }}">
<style>
  html {
    font-size: 1rem !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
    scroll-padding-top: 5rem;
  }

  :root {
    font-size: 1rem !important;
  }
</style>
