        let html = summary.innerHTML;
        if (html.includes("A MicroPython code example")) {
            summary.innerHTML = html
                .replace(/(?<=code example|Pico 2 W microcontroller|on a breadboard) /g, "&nbsp;")
                .replace(/&nbsp;/, " <ul><li>")
                .replace(/&nbsp;/g, " <li>");
        }
    });
</script>
