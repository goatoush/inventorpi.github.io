connected to a crash sensor module with a limit switch, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上に、リミットスイッチ付き衝突センサーモジュール、RGB
  LEDモジュール、およびOLEDディスプレイモジュール（SSD1306）を接続した。
to change the LED color and show the status on the display when crash is detected: 衝突が検出されたときにLEDの色を変更し、ディスプレイにステータスを表示する
A crash sensor uses a limit switch: 衝突センサーはリミットスイッチを使用する
? This can be used with a hard stop to detect when a mechanism, such as a robotic
  arm, reaches the limit of its motion and trigger a limit switch
: これはハードストップと組み合わせて使用​​することで、ロボットアームなどの機構が動作限界に達したことを検知し、リミットスイッチを作動させることができます。
It is also used in oven and refrigerator doors to turn on the internal light when the door is opened: オーブンや冷蔵庫のドアにも使用され、ドアを開けたときに内部照明を点灯させる役割を果たします。
Create a new file in Thonny, with file name crash_sensor.py: Thonnyでcrash_sensor.pyという名前の新しいファイルを作成します。
connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上に、コイルばね付きノックセンサーモジュール、RGB
  LEDモジュール、OLEDディスプレイモジュール（SSD1306）を接続した。
to change the LED color and show the status on the display when a sudden shake is detected: 急な揺れを検知すると、LEDの色を変えてディスプレイに状態を表示する。
A knock sensor detects vibrations: ノックセンサーは振動を検知します
This particular module uses a spring-based vibration switch: このモジュールはバネ式の振動スイッチを使用しています。
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: モジュールが静止しているときは、バネは中央のピンに接触しませんが、衝撃や振動を受けると、バネが揺れて中央のピンに当たり、回路が一時的に閉じます。
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: はしごを登るロボットの場合、ノックセンサーは、伸びたアームがはしごの段に当たったことを検知し、次の動作を開始することができる。
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: 衝突センサーは衝撃点に設置する必要があるが、ノックセンサーはアーム全体の振動を検出できる。
Create a new file in Thonny, with file name knock_sensor.py: Thonnyでknock_sensor.pyという名前の新しいファイルを作成します。
connected to a PIR motion sensor module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上にPIRモーションセンサーモジュール、RGB
  LEDモジュール、OLEDディスプレイモジュール（SSD1306）を接続した。
to change the LED color and show the status on the display when motion is detected: 動きを検知するとLEDの色を変え、ディスプレイに状態を表示する
A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: PIRモーションセンサーは、周囲の物体から放出される赤外線（熱）放射の変化を測定することで動きを検出します。
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: 人間や動物などの温かい物体がフィールドを横切ると、まずセンサーの片側を通過し、次に反対側を通過することで、動きを感知する差動電圧パルスが発生します。
It is used in security alarms and smart home automation: セキュリティアラームやスマートホームオートメーションに使用されます。
Then remove the book and wait for the sensor to detect motion: 次に本を取り外し、センサーが動きを検知するまで待ちます。
Create a new file in Thonny, with file name motion_sensor.py: Thonnyでmotion_sensor.pyという名前の新しいファイルを作成します。
connected to a photo interrupter module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上のフォトインタラプタモジュール、RGB
  LEDモジュール、およびOLEDディスプレイモジュール（SSD1306）に接続されています。
to increment the count on the display each time the photo interrupter light beam is interrupted: フォトインタラプタの光線が遮断されるたびに、ディスプレイ上のカウントをインクリメントする。
? A photo interrupter module sends infrared light beam from an emitter to a receiver
  (the two black blocks on the module), and detects when this beam is blocked
: フォトインタラプタモジュールは、発光体から受光体（モジュール上の2つの黒いブロック）へ赤外線ビームを送信し、このビームが遮られたことを検出します。
It is used to detect end-of-travel in 3D printers, CNC machines and robots: これは、3Dプリンター、CNCマシン、ロボットの移動終端を検出するために使用されます。
It is also used to count the pulses of a slotted disc rotating to calculate motor or wheel speed in robotics and smart cars: また、ロボットやスマートカーにおいて、回転する溝付きディスクのパルス数をカウントしてモーターや車輪の速度を計算するためにも使用されます。
In a printer, it detects when a paper is present: プリンターでは、用紙が存在するかどうかを検知します。
Create a new file in Thonny, with file name photo_interrupter.py: Thonnyでphoto_interrupter.pyというファイル名の新しいファイルを作成します。
connected to a photoresister module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上にフォトレジストモジュール、RGB
  LEDモジュール、OLEDディスプレイモジュール（SSD1306）を接続した。
to dim or brighten the LED to match the change in ambient light measured by the photoresister: フォトレジストで測定した周囲光の変化に合わせてLEDの明るさを調整する
? A photoresister allows more electricity to flow when more light hits its surface,
  and less electricity to flow when less light hits its surface
: フォトレジストは、表面に当たる光が多いほど電流が流れやすく、表面に当たる光が少ないほど電流が流れにくくなる。
It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: 暗い場所ではスマートフォンの画面を暗くし、明るい日光の下では画面を明るくするために使用されます。
Some TVs use it to dim the display to match the ambient room light, to appear like printed wall art: 一部のテレビでは、画面の明るさを室内の明るさに合わせて調整し、まるで壁に印刷された絵画のように見えるようにするためにこの機能を使用しています。
Line tracking robots use it to distinguish between a dark line and a light surface: ライン追跡ロボットは、暗い線と明るい表面を区別するためにこれを使用します。
Create a new file in Thonny, with file name photoresistor.py: Thonnyでphotoresistor.pyという名前の新しいファイルを作成します。
connected to a micro servo motor, a potentiometer (rotation sensor) module and an OLED display module (SSD1306) on a breadboard: ブレッドボード上にマイクロサーボモーター、ポテンショメータ（回転センサー）モジュール、OLEDディスプレイモジュール（SSD1306）を接続した。
to control the angle of the servo by rotating the potentiometer knob and display it on the display: ポテンショメータのノブを回転させてサーボの角度を制御し、その角度をディスプレイに表示する
Potentiometers are the dials we turn to control things like temperature or volume: ポテンショメータは、温度や音量などを制御するために回すダイヤルです。
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: これらは電気抵抗を変化させることで動作し、その変化はマイクロコントローラの入力ピンにおける電圧の変化として解釈されます。
In this script, we use this input to control a servo angle: このスクリプトでは、この入力を使用してサーボの角度を制御します。
A servo is a motor where we can control the rotation angle by changing the PWM signal we send to it: サーボとは、PWM信号を変化させることで回転角度を制御できるモーターのことです。
Unlike standard electric motors that spin continuously, a servo motor moves to an exact angle or position and holds it firmly: 連続的に回転する標準的な電気モーターとは異なり、サーボモーターは正確な角度または位置に移動し、それをしっかりと保持します。
Create a new file in Thonny, with file name potentiometer_and_servo.py: Thonnyでpotentiometer_and_servo.pyというファイル名の新しいファイルを作成します。
Bluetooth Advertise and Bluetooth Scan: BluetoothアドバタイズとBluetoothスキャン
connected to a rotary encoder module, an RGB LED and an OLED display module (SSD1306) on a breadboard: ブレッドボード上にロータリーエンコーダーモジュール、RGB
  LED、OLEDディスプレイモジュール（SSD1306）を接続した。
to individually control the red, green and blue channels of the LED to create any color,: LEDの赤、緑、青の各チャンネルを個別に制御して任意の色を作り出す、
display the hex value and R, G, B values on the display,: ディスプレイに16進数値とR、G、B値を表示する。
broadcast it over bluetooth by embedding it in the service UUID of the BLE advertising data,: BLE広告データのサービスUUIDに埋め込むことでBluetooth経由でブロードキャストし、
and show the received color on LEDs, creating a cluster of synced Pico devices: 受信した色をLEDに表示し、同期されたPicoデバイスのクラスターを作成する。
? We use a rotary encoder to change red, green and blue color of the LED, then broadcast
  that color to nearby devices, which set their LEDs to the same color
: ロータリーエンコーダを使用してLEDの赤、緑、青の色を変更し、その色を近くのデバイスに送信して、デバイスが自身のLEDを同じ色に設定するようにします。
? When one device runs bluetooth_advertise.py and multiple nearby devices run bluetooth_scan.py,
  we can create a network of synced devices
: 1台のデバイスがbluetooth_advertise.pyを実行し、近くの複数のデバイスがbluetooth_scan.pyを実行すると、同期されたデバイスのネットワークを作成できます。
This is how a cluster of robots can communicate and work together: これがロボット群が通信し、連携して作業する方法です。
Create a new file in Thonny, with file name bluetooth_advertise.py: Thonnyでbluetooth_advertise.pyという名前の新しいファイルを作成します。
? To test with bluetooth_scan.py running on a different device, on the second device’s
  computer, create a new file in Thonny, with file name bluetooth_scan.py
: 別のデバイスでbluetooth_scan.pyを実行してテストするには、2番目のデバイスのコンピューターで、Thonnyにbluetooth_scan.pyという名前の新しいファイルを作成します。
Mix and Match Inputs and Outputs: 入力と出力を自由に組み合わせる
connected to a micro servo motor, an RGB LED, a passive piezo buzzer, an OLED display module (SSD1306): マイクロサーボモーター、RGB
  LED、パッシブピエゾブザー、OLEDディスプレイモジュール（SSD1306）に接続されています。
? and one of several input components - an accelerometer, push button, motion sensor,
