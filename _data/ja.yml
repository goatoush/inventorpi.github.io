: ピエゾブザーは、圧電効果を利用して電気信号を高速の機械的振動に変換し、音波を発生させることで動作します。
In this script, we send different frequencies to a piezo buzzer to play different musical notes: このスクリプトでは、異なる周波数をピエゾブザーに送信して、異なる音を鳴らします。
