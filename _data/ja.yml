Important Do’s and Don’ts: 重要な注意事項
Do …: する …
Disconnect Pico before changing connectors: コネクタを交換する前にPicoを取り外してください
Verify all connections, especially VCC and GND: すべての接続、特にVCCとGNDの接続を確認してください。
Establish team roles like coding, wiring, verifying circuit, capturing notes and recording: コーディング、配線、回路の検証、メモの記録、録音などのチームの役割分担を確立する
Read experiment description and code: 実験の説明とコードを読んでください。
Don’t …: しないで…
Don’t power on before verifying all connections: すべての接続を確認する前に電源を入れないでください
Incorrect VCC and GND can destroy sensitive electronics: VCCとGNDの接続が間違っていると、精密電子機器が破損する可能性があります。
Don’t rely on numbers printed on the breadboard: ブレッドボードに印刷されている数字に頼らないでください
Count point distance from other connectors on the board to verify: ボード上の他のコネクタからのポイント距離を数えて検証します
Don’t leave before putting everything back in the kit box: キットボックスの中身を全て戻すまで、出発しないでください。
