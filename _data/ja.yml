connected to a capacitive touch sensor module, a passive piezo buzzer, and an OLED display module (SSD1306) on a breadboard: ブレッドボード上に静電容量式タッチセンサーモジュール、パッシブピエゾブザー、およびOLEDディスプレイモジュール（SSD1306）を接続した。
to create a reaction time testing game,: 反応時間テストゲームを作成するために、
and to learn to draw shapes on the OLED display: OLEDディスプレイ上に図形を描く方法を学ぶ
A capacitive touch sensor detects a touch by measuring changes in electrical charge when a human finger comes close: 静電容量式タッチセンサーは、人間の指が近づいたときの電荷の変化を測定することでタッチを検出します。
Humans are full of water and salt, making the body a natural conductor of electricity: 人間の体は水分と塩分を多く含んでおり、そのため電気を通しやすい性質を持っている。
It is used in smartphones for multi-touch navigation and gesture detection: スマートフォンでは、マルチタッチナビゲーションやジェスチャー検出に使用されます。
In this script, we create a short game to test your reaction time, while also learning how to draw shapes on the OLED screen: このスクリプトでは、反応速度をテストする短いゲームを作成すると同時に、OLEDスクリーンに図形を描く方法も学びます。
'To read the sensor, we run:': センサーを読み取るには、以下を実行します。
The function below draws happy or sad face based on the parameters passed to it: 以下の関数は、渡されたパラメータに基づいて、笑顔または悲しい顔を描画します。
The main loop of our game is easy to follow because it calls easy to understand function names: ゲームのメインループは、理解しやすい関数名を使用しているため、簡単に追跡できます。
Create a new file in Thonny, with file name touch_game.py: Thonnyでtouch_game.pyという名前の新しいファイルを作成します。
? connected to an ultrasonic distance sensor module (HC-SR04), a micro servo motor,
  a passive piezo buzzer, an RGB LED module, and an OLED display module (SSD1306)
  on a breadboard
: ブレッドボード上に、超音波距離センサーモジュール（HC-SR04）、マイクロサーボモーター、パッシブピエゾブザー、RGB LEDモジュール、およびOLEDディスプレイモジュール（SSD1306）を接続した。
? to create a gesture based sound instrument that converts the distance measured to
  different buzzer sound frequencies, servo angles and LED colors, and displays the
  distance measured on the OLED display
: 測定された距離をさまざまなブザー音の周波数、サーボ角度、LEDの色に変換し、測定された距離をOLEDディスプレイに表示する、ジェスチャーベースの音響機器を作成する。
A distance sensor measures the distance to any nearby obstruction: 距離センサーは、近くにある障害物までの距離を測定します。
Robots and cars use such sensors to stop before hitting any obstruction: ロボットや自動車は、障害物に衝突する前に停止するために、このようなセンサーを使用します。
The sensor used here is an ultrasonic distance sensor: ここで使用されているセンサーは超音波距離センサーです。
? We convert the distance to different RGB colors and buzzer frequencies to create
  a fun musical instrument that you can play with hand gestures
: 距離を様々なRGBカラーとブザー周波数に変換することで、手のジェスチャーで演奏できる楽しい楽器を作り出します。
We also change the angle of a servo motor based on the distance detected: 検出された距離に基づいてサーボモーターの角度も変更します。
Create a new file in Thonny, with file name distance_sensor.py: Thonnyでdistance_sensor.pyという名前の新しいファイルを作成します。
connected to a passive piezo buzzer, an OLED display module (SSD1306) and 6 push buttons on a breadboard: パッシブピエゾブザー、OLEDディスプレイモジュール（SSD1306）、およびブレッドボード上の6つのプッシュボタンに接続されています。
to play different musical notes on the buzzer,: ブザーで異なる音符を鳴らす、
draw the notes and musical staff lines on the display,: ディスプレイに音符と五線譜を描き、
and replay as a recording after a pause: 一時停止後に録音として再生する
We use the buttons to play different musical notes: ボタンを使って様々な音符を演奏します
We also learn how to draw shapes on the OLED screen to draw the notes on musical staff lines: また、OLEDスクリーン上に図形を描いて楽譜の五線譜に音符を描く方法も学びます。
And when user input pauses, we replay the notes to create a fun musical instrument: ユーザーの入力が一時停止すると、音符を再生して楽しい楽器を作り出します。
We read 6 different inputs for the 6 buttons: 6つのボタンに対して6つの異なる入力を読み取りました
For this, we add some more helper functions below: そのため、以下にいくつかのヘルパー関数を追加します。
With all these functions, our main loop is still easy to follow: これらの機能をすべて備えても、メインループは依然として理解しやすい。
To put it all together, and test, create a new file in Thonny, with file name piano.py: これら全てをまとめてテストするには、Thonnyでpiano.pyという名前の新しいファイルを作成します。
connected to an analog 2-axis thumb joystick module, 2 micro servo motors and an OLED display module (SSD1306) on a breadboard: ブレッドボード上にアナログ2軸サムジョイスティックモジュール、2つのマイクロサーボモーター、およびOLEDディスプレイモジュール（SSD1306）が接続されています。
to control the angles of both servos using the joystick and display the angles on the OLED display: ジョイスティックを使用して両方のサーボの角度を制御し、その角度をOLEDディスプレイに表示する。
A joystick is often used for navigation in robots, drones, cruise ships and planes: ジョイスティックは、ロボット、ドローン、クルーズ船、飛行機などの操縦によく使用されます。
In FRC robotics, we use 2 gaming controllers, with 2 joysticks per controller: FRCロボティクスでは、2つのゲームコントローラーを使用し、各コントローラーには2つのジョイスティックが付いています。
Each joystick includes independent X and Y axis control: 各ジョイスティックには、独立したX軸とY軸の制御機能が備わっています。
Which  gives us a total of 8 independent axes to control the robot: これにより、ロボットを制御するための独立した軸が合計8つ得られます。
In this script, we control the angle of two servos using different axes of the joystick: このスクリプトでは、ジョイスティックの異なる軸を使用して2つのサーボの角度を制御します。
By pressing the joystick button, we toggle the mode to Sync Angle Mode: ジョイスティックのボタンを押すと、同期角度モードに切り替わります。
Now we use trigonometry to calculate the angle the joystick lever makes, and set the servos to match this angle: 次に、三角法を用いてジョイスティックレバーの角度を計算し、サーボモーターをこの角度に合わせるように設定します。
In robotics, we often use advanced mathematics to control various motions: ロボット工学では、さまざまな動作を制御するために高度な数学を用いることが多い。
Create a new file in Thonny, with file name joystick_and_servos.py: Thonnyでjoystick_and_servos.pyというファイル名の新しいファイルを作成します。
Microphone Sensor and Melody: マイクセンサーとメロディ
connected to a microphone sound sensor module, a passive piezo buzzer and an OLED display module (SSD1306) on a breadboard: ブレッドボード上に、マイクロフォン音センサーモジュール、パッシブピエゾブザー、OLEDディスプレイモジュール（SSD1306）を接続した。
to replay the sound frequencies measured by the microphone on the buzzer and display them on the display: ブザーのマイクロホンで測定した音の周波数を再生し、ディスプレイに表示する。
? A microphone sound sensor converts environmental sound waves into electrical signals
  using a built-in microphone and an onboard processing circuit
: マイクロフォンサウンドセンサーは、内蔵マイクロフォンとオンボード処理回路を使用して、周囲の音波を電気信号に変換します。
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: 音波は空気中を伝わり、モジュール内のマイクロフォン内部にある小さな柔軟な振動板に当たる。
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: 振動板の変動によって、音の周波数と音量に一致する電気信号が生成される。
Run this script, and simultaneously run melody.py on a different device: このスクリプトを実行すると同時に、別のデバイスでmelody.pyを実行してください。
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: デバイス同士を近づけ、メロディーを再生しているデバイスのブザーの真上にマイクを直接置いてください。
If the room is not very noisy, it should pick up at least some of the notes: 部屋があまり騒がしくなければ、少なくともいくつかの音符は拾えるはずです。
Create a new file in Thonny, with file name microphone_sensor.py: Thonnyでmicrophone_sensor.pyというファイル名の新しいファイルを作成します。
connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: ブレッドボード上の3軸デジタル加速度計モジュール（ADXL345）とOLEDディスプレイモジュール（SSD1306）に接続されています。
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: 加速度センサーをX軸とY軸を中心に回転させることで、OLEDディスプレイ上に3D形状を描画および回転させる。
An accelerometer measures acceleration around the x, y and z axis: 加速度計は、x、y、z軸周りの加速度を測定します。
In robotics, it is essential in determining the robot position and movement: ロボット工学において、ロボットの位置と動きを決定する上で不可欠である。
In this script, we draw a 3D shape, and control its rotation using the accelerometer: このスクリプトでは、3D形状を描画し、加速度センサーを使用してその回転を制御します。
Create a new file in Thonny, with file name accelerometer.py: Thonnyでaccelerometer.pyという名前の新しいファイルを作成します。
Write your first script “blink.py” by following the instructions below: 以下の手順に従って、最初のスクリプト「blink.py」を作成してください。
Once you get it to work on your Pico, try connecting the humidity and temperature sensor in the next experiment: Picoで動作確認ができたら、次の実験で湿度センサーと温度センサーを接続してみてください。
After that, try random experiments from the list below: その後、以下のリストからランダムに実験を試してみてください。
