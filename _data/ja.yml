Class Experiments Kit Contents: 授業用実験キットの内容
Teachers can run a one hour workshop with middle school students interested in STEM: 教師は、STEMに興味のある中学生を対象に1時間のワークショップを開催することができます。
Each class experiments kit includes 5 identical invention kits and one Additional Sensors Kit: 各授業用実験キットには、同一の発明キットが5個と追加センサーキットが1個含まれています。
It is available for optional extra reading, if desired: ご希望であれば、オプションの追加読書としてご利用いただけます。
Class Experiments Kit includes 5 identical invention kits and one Additional Sensors Kit: クラス実験キットには、同一の発明キットが5個と追加センサーキットが1個含まれています。
Reference slides from our first workshop are included below, which you can use as-is, or incorporate within your presentation: 最初のワークショップで使用した参考スライドを以下に掲載します。そのまま使用することも、ご自身のプレゼンテーションに組み込むことも可能です。
Download Slides: スライドをダウンロード
Please familiarize yourself with the contents of the invention kit and the Additional Sensors Kit: 発明キットおよび追加センサーキットの内容をよくご確認ください。
? The Additional Sensors Kit includes reward stickers that you can distribute for
  the best creative ideas, active participation, etc
: 追加センサーキットには、最高の創造的なアイデアや積極的な参加などに配布できる報酬ステッカーが含まれています。
? There are also some tiny NFC nail stickers that light up when brought near a smartphone
  with NFC (often at the back near the top center)
: また、NFC機能を搭載したスマートフォン（多くの場合、背面の上部中央付近にNFCセンサーがある）に近づけると光る、小さなNFCネイルステッカーもある。
The first step is installing the Thonny app: 最初のステップは、Thonnyアプリをインストールすることです。
It is important for the students to learn how breadboard connections work and to be safe: 生徒たちがブレッドボードの接続方法と安全について学ぶことは重要です
The Additional Sensors Kit includes a breadboard with no backing to show how it works: 追加センサーキットには、動作原理を示すための裏板のないブレッドボードが含まれています。
? There is a resettable fuse on the breadboard which disconnects the circuit in case
  a student accidentally creates a short circuit on the breadboard
: ブレッドボードにはリセット可能なヒューズが付いており、学生が誤ってブレッドボード上でショート回路を起こした場合に回路を遮断します。
? The students still need to verify all connections before powering on the circuit,
  because incorrect connections to the sensors can cause permanent damage to their
  sensitive electronics, rendering them useless
: センサーへの接続が間違っていると、繊細な電子機器に永久的な損傷を与え、使用不能にしてしまう可能性があるため、生徒たちは回路に電源を入れる前にすべての接続を確認する必要があります。
? When setting up the connectors, students should disconnect the USB cable from Pico,
  and have multiple students verify the connections before connecting the USB cable
: コネクタをセットアップする際は、生徒はPicoからUSBケーブルを外し、USBケーブルを接続する前に複数の生徒が接続を確認するようにしてください。
It is useful to count the pin distance from other used pins on the board: 基板上の他の使用済みピンからのピンの距離を数えることは有用です
Safety Procedure: 安全手順
Power Off: 電源オフ
Connect Components: 接続コンポーネント
Verify Each Connection: 各接続を確認する
Power On: 電源オン
Introduction - Learn about electronics, breadboards, safety (10-20 min): はじめに - 電子工作、ブレッドボード、安全対策について学びます（10～20分）
Divide class into 5 teams (one per invention kit) (3-5 min): クラスを5つのチームに分けます（発明キット1セットにつき1チーム）。（3～5分）
Students familiarize themselves with the invention kit components (3-5 min): 生徒は発明キットの構成要素について理解を深める（3～5分）
Run first experiments, learning the basics (Blink, then Humidity Temp Sensor) (5-10 min): まず、基本的な操作（点滅、次に湿度温度センサー）を学ぶための実験を行います（5～10分）。
Run random experiments from the list, and present to other teams (20-30 min): リストからランダムに実験を選び、他のチームに発表する（20～30分）。
Clean up and pack the kits (5-7 min): キットを片付けて梱包する（5～7分）
? To facilitate running additional workshops in future, students should pack the contents
  back into the boxes the way they found them
: 今後追加のワークショップを開催しやすくするため、学生は中身を元の箱の状態に戻して梱包する必要があります。
If teams have more than 3 students, they can take turns reading about an experiment and running an experiment: チームの人数が3人以上の場合、実験に関する資料を読んだり、実験を行ったりする役割分担をすることができます。
? When students borrow sensors from the Additional Sensors Kit, they should return
  the sensors after their experiment so other teams can borrow them
: 生徒が追加センサーキットからセンサーを借りた場合、実験後にセンサーを返却して、他のチームが借りられるようにする必要があります。
? Some experiments work in pairs, requiring 2 teams to collaborate using two Picos
  at the same time (Microphone sensor and melody, and bluetooth advertise and scan)
: 一部の実験はペアで行われ、2つのチームが同時に2台のPicoを使用して協力する必要があります（マイクセンサーとメロディー、Bluetoothアドバタイズとスキャン）。
? Bluetooth advertise and scan should be a fun experiment for the entire class, where
  all the devices synchronize their LED colors to match one advertising device
: Bluetoothの広告とスキャンは、クラス全員にとって楽しい実験となるはずです。すべてのデバイスがLEDの色を同期させて、1つの広告デバイスに合わせます。
You could direct one team to work on Bluetooth advertise and others to setup Bluetooth scan before time runs out: 時間切れになる前に、1つのチームにBluetoothアドバタイズメントの作業をさせ、他のチームにBluetoothスキャンの設定をさせるように指示することができます。
