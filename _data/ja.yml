Toggle the switch on the battery pack to ON (Insert 3 included AA batteries first, if empty): バッテリーパックのスイッチをONに切り替えてください（空の場合は、付属の単3電池3本を先に挿入してください）。
"On the breadboard, press the blue button \U0001F535 once to launch the menu on the OLED screen": "ブレッドボード上で、青いボタン\U0001F535を一度押すと、OLEDスクリーンにメニューが表示されます。"
