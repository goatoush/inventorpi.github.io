A MicroPython code example: MicroPythonコードの例
to blink an onboard LED repeatedly: オンボードLEDを繰り返し点滅させる
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: まずは、Picoマイクロコントローラに搭載されているLEDを制御するためのシンプルなマイクロPythonスクリプトから始めましょう。
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: マシンライブラリの
  Pin オブジェクトを使用して、GPIO (汎用入出力) ピンにアクセスします。
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): オンボードLEDには、GP25、または「LED」という名前でPin(“LED”)またはPin(25)としてアクセスできます。
We use Pin.OUT to set it as an output pin: Pin.OUTを使用して、それを出力ピンとして設定します。
We will use input pins later with sensors: 入力ピンは後ほどセンサーで使用します
Create a new file in Thonny, with file name blink.py: Thonnyでblink.pyという名前の新しいファイルを作成します。
Copy and paste the code below into the file you created: 以下のコードをコピーして、作成したファイルに貼り付けてください。
Now let’s add the main loop: それでは、メインループを追加しましょう。
We add a 1 second delay with the sleep(1) statement: sleep(1)文で1秒の遅延を追加します
Copy and paste the code below to the end of the blink.py file: 以下のコードをコピーして、blink.pyファイルの末尾に貼り付けてください。
Congratulations, you have written and run your first MicroPython script: おめでとうございます！初めてのMicroPythonスクリプトの作成と実行に成功しました。
