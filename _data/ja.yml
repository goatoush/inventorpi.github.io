connected to a humidity and temperature sensor module (DHT11) and an OLED display module (SSD1306) on a breadboard: ブレッドボード上の湿度・温度センサーモジュール（DHT11）とOLEDディスプレイモジュール（SSD1306）に接続されています。
to measure and display the relative humidity and ambient temperature in both celsius and fahrenheit: 相対湿度と周囲温度を摂氏と華氏の両方で測定し表示する
A humidity and temperature sensor measures the ambient temperature and air humidity: 湿度・温度センサーは、周囲の温度と空気中の湿度を測定します。
In robotics, temperature sensors are built into most electronic components: ロボット工学では、温度センサーはほとんどの電子部品に組み込まれている。
They can be used for thermal protection, such as to automatically shutdown a robot when temperatures exceed safe limits: これらは、温度が安全限界を超えた場合にロボットを自動的にシャットダウンするなど、熱保護に使用できます。
? Did you know that a smartphone has about 8 different temperature sensors in it,
  measuring screen temperature, back temperature, battery temperature, CPU temperature,
  etc.? Humidity sensors monitor condensation inside a smartphone or smartwatch
: スマートフォンには、画面温度、背面温度、バッテリー温度、CPU温度などを測定する約8種類の温度センサーが搭載されていることをご存知ですか？湿度センサーは、スマートフォンやスマートウォッチ内部の結露を監視します。
This is a DHT11 sensor: これはDHT11センサーです
'We import the dht library and setup the GP28 pin as shown below:': dhtライブラリをインポートし、以下に示すようにGP28ピンを設定します。
Then in the main loop, we use the measure function to get the temperature and humidity: 次に、メインループで、測定関数を使用して温度と湿度を取得します。
We can use simple math formula to convert from celsius to fahrenheit: 摂氏から華氏への変換には、簡単な数式を使用できます。
To run the full script, create a new file in Thonny, with file name humidity_temp_sensor.py: スクリプト全体を実行するには、Thonny
  に humidity_temp_sensor.py という名前の新しいファイルを作成してください。
