How to Run Experiments with Thonny: Thonnyで実験を実行する方法
Launch Thonny App on your computer, if it is not already running: Thonnyアプリがまだ起動していない場合は、コンピューターで起動してください。
Read the guide and the code for the experiment on this website and create a new file as described: このウェブサイトにある実験ガイドとコードを読み、説明に従って新しいファイルを作成してください。
Connect the components as described before connecting Pico to power supply: Picoを電源に接続する前に、説明されているようにコンポーネントを接続してください。
Verify all the connections are to the correct Pins, especially the VCC and GND connections: すべての接続が正しいピンに接続されていることを確認してください。特にVCCとGNDの接続を確認してください。
To end the experiment, disconnect the USB cable from Pico: 実験を終了するには、PicoからUSBケーブルを外してください。
To select another experiment, repeat the steps above: 別の実験を選択するには、上記の手順を繰り返してください。
