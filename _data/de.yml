A MicroPython code example: Ein MicroPython-Codebeispiel
to blink an onboard LED repeatedly: eine integrierte LED wiederholt blinken lassen
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Beginnen
  wir mit einem einfachen MicroPython-Skript zur Steuerung der integrierten LED des
  Pico-Mikrocontrollers
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: Wir
  greifen auf die GPIO-Pins (General Purpose Input Output) zu, indem wir das Pin-Objekt
  aus der Machine-Bibliothek verwenden
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): Die
  integrierte LED kann über GP25 oder den Namen „LED“ als Pin(“LED”) oder Pin(25)
  angesteuert werden
We use Pin.OUT to set it as an output pin: Wir verwenden Pin.OUT, um es als Ausgangspin
  festzulegen
We will use input pins later with sensors: Wir werden die Eingangspins später mit
  Sensoren verwenden
Create a new file in Thonny, with file name blink.py: Erstelle in Thonny eine neue
  Datei mit dem Dateinamen blink.py
Copy and paste the code below into the file you created: Kopieren Sie den unten stehenden
  Code und fügen Sie ihn in die von Ihnen erstellte Datei ein
Now let’s add the main loop: Fügen wir nun die Hauptschleife hinzu
We add a 1 second delay with the sleep(1) statement: Mit der Anweisung sleep(1) fügen
  wir eine Verzögerung von 1 Sekunde hinzu
Copy and paste the code below to the end of the blink.py file: Kopieren Sie den unten
  stehenden Code und fügen Sie ihn am Ende der Datei blink.py ein
Congratulations, you have written and run your first MicroPython script: Herzlichen
  Glückwunsch, Sie haben Ihr erstes MicroPython-Skript geschrieben und ausgeführt
