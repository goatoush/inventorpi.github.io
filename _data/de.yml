Do’s and Don’ts: Gebote und Verbote
? A resettable fuse (PPTC fuse or polyfuse) is the small orange-yellow component connecting
  the Pico 3.3V Out Pin to the breadboard
: Eine rücksetzbare Sicherung (PPTC-Sicherung oder Polyfuse) ist das kleine orange-gelbe
  Bauteil, das den 3,3-V-Ausgangspin des Pico mit dem Steckbrett verbindet
rail: Schiene
When there is a short circuit, such as a jumper wire accidentally connecting VCC (breadboard: Bei
  einem Kurzschluss, beispielsweise wenn ein Jumperkabel versehentlich VCC (Steckbrett)
  verbindet,
rail) to GND  (breadboard: Schiene) zu GND (Steckbrett)
rail), it trips, preventing damage to the electronics: "(Schiene), löst es aus und
  verhindert so Schäden an der Elektronik"
A few seconds after the circuit is fixed or the power is turned off, it cools down and resets itself: Wenige
  Sekunden nachdem der Stromkreis repariert oder die Stromzufuhr unterbrochen wurde,
  kühlt er ab und setzt sich selbst zurück
The students should verify all the connections and resume the experiment: Die Studierenden
  sollten alle Verbindungen überprüfen und das Experiment fortsetzen
Resettable Fuse: Rücksetzbare Sicherung
