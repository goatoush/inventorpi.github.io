A knock sensor detects vibrations: Ein Klopfsensor erkennt Vibrationen
This particular module uses a spring-based vibration switch: Dieses spezielle Modul
  verwendet einen federbasierten Vibrationsschalter
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: Im Ruhezustand des Moduls berührt die Feder den Mittelstift nicht, aber bei Stößen
  oder Erschütterungen schwingt die Feder und trifft auf den Mittelstift, wodurch
  der Stromkreis kurzzeitig geschlossen wird
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: Bei
  einem Leiterkletterroboter könnte ein Klopfsensor erkennen, wenn ein ausfahrender
  Arm eine Leitersprosse berührt, und dann die nächste Bewegung einleiten
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: Während
  ein Crashsensor am Aufprallpunkt angebracht werden müsste, könnte ein Klopfsensor
  Vibrationen über den gesamten Arm erfassen
