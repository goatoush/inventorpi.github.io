Potentiometers are the dials we turn to control things like temperature or volume: Potentiometer
  sind die Drehregler, mit denen wir Dinge wie Temperatur oder Lautstärke steuern
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: Sie
  funktionieren durch die Veränderung des elektrischen Widerstands, was wir als Spannungsänderung
  an einem Eingangspin eines Mikrocontrollers ablesen
In this script, we use this input to control a servo angle: In diesem Skript verwenden
  wir diesen Eingang, um einen Servowinkel zu steuern
A servo is a motor where we can control the rotation angle by changing the PWM signal we send to it: Ein
  Servo ist ein Motor, dessen Drehwinkel durch Ändern des an ihn gesendeten PWM-Signals
  gesteuert werden kann
Unlike standard electric motors that spin continuously, a servo motor moves to an exact angle or position and holds it firmly: Im
  Gegensatz zu herkömmlichen Elektromotoren, die sich kontinuierlich drehen, bewegt
  sich ein Servomotor auf einen exakten Winkel oder eine Position und hält diese fest
