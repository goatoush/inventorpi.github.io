: Ein Fotowiderstand lässt mehr Strom fließen, wenn mehr Licht auf seine Oberfläche
  trifft, und weniger Strom, wenn weniger Licht auf seine Oberfläche trifft
It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: Es
