Utshaho revels in the intersection of math and science with language and international relations: Utshaho
  schwelgt in der Schnittstelle von Mathematik und Naturwissenschaften mit Sprache
  und internationalen Beziehungen
? He is the captain of the IHOT robotics team and math club, and has also co-founded
  the school newspaper and the French MUN program
: Er ist Kapitän des IHOT-Robotik-Teams und des Mathematikclubs und hat außerdem die
  Schülerzeitung und das französische MUN-Programm mitbegründet
He loves traveling, band, track and photography and he is a 3rd degree black belt in Karate: Er
  liebt Reisen, Musik, Leichtathletik und Fotografie und ist Träger des 3. Dan im
