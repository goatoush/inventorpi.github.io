: Ziel ist es, ein gestenbasiertes Klanginstrument zu entwickeln, das die gemessene
  Entfernung in verschiedene Summerfrequenzen, Servowinkel und LED-Farben umwandelt
  und die gemessene Entfernung auf dem OLED-Display anzeigt
A distance sensor measures the distance to any nearby obstruction: Ein Abstandssensor
  misst die Entfernung zu einem Hindernis in der Nähe
Robots and cars use such sensors to stop before hitting any obstruction: Roboter und
  Autos nutzen solche Sensoren, um vor dem Aufprall auf ein Hindernis anzuhalten
The sensor used here is an ultrasonic distance sensor: Der hier verwendete Sensor
  ist ein Ultraschall-Distanzsensor
? We convert the distance to different RGB colors and buzzer frequencies to create
  a fun musical instrument that you can play with hand gestures
: Wir wandeln die Entfernung in verschiedene RGB-Farben und Summerfrequenzen um, um
  ein unterhaltsames Musikinstrument zu erschaffen, das man mit Handgesten spielen
  kann
We also change the angle of a servo motor based on the distance detected: Wir ändern
  außerdem den Winkel eines Servomotors basierend auf der erfassten Entfernung
Create a new file in Thonny, with file name distance_sensor.py: Erstellen Sie in Thonny
  eine neue Datei mit dem Dateinamen distance_sensor.py
connected to a passive piezo buzzer, an OLED display module (SSD1306) and 6 push buttons on a breadboard: verbunden
  mit einem passiven Piezo-Summer, einem OLED-Displaymodul (SSD1306) und 6 Drucktastern
  auf einem Steckbrett
to play different musical notes on the buzzer,: verschiedene musikalische Töne auf
  dem Summer spielen,
draw the notes and musical staff lines on the display,: Zeichne die Noten und Notenlinien
  auf den Bildschirm
and replay as a recording after a pause: und nach einer Pause als Aufnahme wiedergeben
We use the buttons to play different musical notes: Wir benutzen die Knöpfe, um verschiedene
  Noten zu spielen
We also learn how to draw shapes on the OLED screen to draw the notes on musical staff lines: Wir
  lernen außerdem, wie man Formen auf dem OLED-Bildschirm zeichnet, um Noten auf Notenlinien
  darzustellen
And when user input pauses, we replay the notes to create a fun musical instrument: Und
  wenn die Benutzereingabe pausiert, spielen wir die Noten erneut ab, um ein unterhaltsames
  Musikinstrument zu erzeugen
We read 6 different inputs for the 6 buttons: Wir haben 6 verschiedene Eingaben für
  die 6 Tasten ausgelesen
For this, we add some more helper functions below: Hierfür fügen wir unten einige
  weitere Hilfsfunktionen hinzu
With all these functions, our main loop is still easy to follow: Trotz all dieser
  Funktionen ist unsere Hauptschleife immer noch leicht zu verfolgen
To put it all together, and test, create a new file in Thonny, with file name piano.py: Um
  alles zusammenzufügen und zu testen, erstellen Sie in Thonny eine neue Datei mit
  dem Dateinamen piano.py
connected to an analog 2-axis thumb joystick module, 2 micro servo motors and an OLED display module (SSD1306) on a breadboard: verbunden
  mit einem analogen 2-Achsen-Daumenjoystick-Modul, 2 Mikroservomotoren und einem
  OLED-Displaymodul (SSD1306) auf einem Steckbrett
to control the angles of both servos using the joystick and display the angles on the OLED display: Die
  Winkel beider Servos können mit dem Joystick gesteuert und auf dem OLED-Display
  angezeigt werden
A joystick is often used for navigation in robots, drones, cruise ships and planes: Ein
  Joystick wird häufig zur Navigation in Robotern, Drohnen, Kreuzfahrtschiffen und
  Flugzeugen verwendet
In FRC robotics, we use 2 gaming controllers, with 2 joysticks per controller: Im
  FRC-Robotik-Bereich verwenden wir 2 Gaming-Controller mit jeweils 2 Joysticks
Each joystick includes independent X and Y axis control: Jeder Joystick verfügt über
  eine unabhängige Steuerung der X- und Y-Achse
Which  gives us a total of 8 independent axes to control the robot: Das ergibt insgesamt
  8 unabhängige Achsen zur Steuerung des Roboters
In this script, we control the angle of two servos using different axes of the joystick: In
  diesem Skript steuern wir den Winkel zweier Servos mithilfe verschiedener Achsen
  des Joysticks
By pressing the joystick button, we toggle the mode to Sync Angle Mode: Durch Drücken
  der Joystick-Taste schalten wir in den Modus „Winkel synchronisieren“ um
Now we use trigonometry to calculate the angle the joystick lever makes, and set the servos to match this angle: Nun
  verwenden wir Trigonometrie, um den Winkel zu berechnen, den der Joystick-Hebel
  bildet, und stellen die Servos entsprechend diesem Winkel ein
In robotics, we often use advanced mathematics to control various motions: In der
  Robotik nutzen wir häufig fortgeschrittene mathematische Methoden, um verschiedene
  Bewegungen zu steuern
Create a new file in Thonny, with file name joystick_and_servos.py: Erstellen Sie
  in Thonny eine neue Datei mit dem Dateinamen joystick_and_servos.py
Microphone Sensor and Melody: Mikrofonsensor und Melodie
connected to a microphone sound sensor module, a passive piezo buzzer and an OLED display module (SSD1306) on a breadboard: auf
  einem Steckbrett mit einem Mikrofon-Schallsensormodul, einem passiven Piezo-Summer
  und einem OLED-Displaymodul (SSD1306) verbunden
to replay the sound frequencies measured by the microphone on the buzzer and display them on the display: die
  vom Mikrofon des Summers gemessenen Tonfrequenzen wiederzugeben und auf dem Display
  anzuzeigen
? A microphone sound sensor converts environmental sound waves into electrical signals
  using a built-in microphone and an onboard processing circuit
: Ein Mikrofon-Schallsensor wandelt Umgebungsschallwellen mithilfe eines eingebauten
  Mikrofons und einer integrierten Verarbeitungsschaltung in elektrische Signale um
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: Schallwellen
  breiten sich durch die Luft aus und treffen auf eine winzige, flexible Membran im
  Inneren des Mikrofons des Moduls
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: Die
  Schwankungen der Membran erzeugen elektrische Signale, die der Schallfrequenz und
  Lautstärke entsprechen
Run this script, and simultaneously run melody.py on a different device: Führe dieses
  Skript aus und starte gleichzeitig melody.py auf einem anderen Gerät
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: Bringen
  Sie die Geräte nahe beieinander und platzieren Sie das Mikrofon direkt über dem
  Summer des Geräts, das die Melodie abspielt
If the room is not very noisy, it should pick up at least some of the notes: Wenn
  der Raum nicht sehr laut ist, sollte er zumindest einige der Töne aufnehmen
Create a new file in Thonny, with file name microphone_sensor.py: Erstellen Sie in
  Thonny eine neue Datei mit dem Namen microphone_sensor.py
connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: auf
  einem Steckbrett mit einem 3-Achsen-Digitalbeschleunigungsmessermodul (ADXL345)
  und einem OLED-Displaymodul (SSD1306) verbunden
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: Eine
  3D-Form auf dem OLED-Display zeichnen und drehen, indem der Beschleunigungsmesser
  um seine X- und Y-Achse gedreht wird
An accelerometer measures acceleration around the x, y and z axis: Ein Beschleunigungsmesser
  misst die Beschleunigung um die x-, y- und z-Achse
In robotics, it is essential in determining the robot position and movement: In der
  Robotik ist es unerlässlich, um die Position und Bewegung des Roboters zu bestimmen
In this script, we draw a 3D shape, and control its rotation using the accelerometer: In
  diesem Skript zeichnen wir eine 3D-Form und steuern deren Rotation mithilfe des
  Beschleunigungsmessers
Create a new file in Thonny, with file name accelerometer.py: Erstellen Sie in Thonny
  eine neue Datei mit dem Dateinamen accelerometer.py
Write your first script “blink.py” by following the instructions below: Schreiben
  Sie Ihr erstes Skript „blink.py“ gemäß den folgenden Anweisungen
Once you get it to work on your Pico, try connecting the humidity and temperature sensor in the next experiment: Sobald
  es auf Ihrem Pico funktioniert, versuchen Sie im nächsten Experiment, den Feuchtigkeits-
  und Temperatursensor anzuschließen
After that, try random experiments from the list below: Probieren Sie anschließend
  zufällige Experimente aus der folgenden Liste aus
Some experiments need additional sensors from the common additional sensors kit to be shared by all teams: Für
