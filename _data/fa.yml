A MicroPython code example: یک نمونه کد میکروپایتون
running on a Raspberry Pi Pico 2 W microcontroller: اجرا روی میکروکنترلر Raspberry
  Pi Pico 2 W
to blink an onboard LED repeatedly: چشمک زدن مکرر یک LED روی برد
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: بیایید
  با یک اسکریپت میکروپایتون ساده برای کنترل LED روی میکروکنترلر Pico شروع کنیم
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: ما
  با استفاده از شیء Pin از کتابخانه ماشین، به پین‌های GPIO (ورودی خروجی همه منظوره)
  دسترسی پیدا می‌کنیم
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): به
  LED روی برد می‌توان از طریق GP25 یا با نام «LED» به صورت Pin(“LED”) یا Pin(25) دسترسی
  پیدا کرد
We use Pin.OUT to set it as an output pin: ما از Pin.OUT برای تنظیم آن به عنوان پین
  خروجی استفاده می‌کنیم
We will use input pins later with sensors: ما بعداً از پین‌های ورودی با سنسورها استفاده
  خواهیم کرد
Create a new file in Thonny, with file name blink.py: یک فایل جدید در Thonny با نام
  blink.py ایجاد کنید
Copy and paste the code below into the file you created: کد زیر را کپی کرده و در فایلی
  که ایجاد کرده‌اید، قرار دهید
Now let’s add the main loop: حالا حلقه اصلی را اضافه می‌کنیم
? In the code below, <span translate="no"><code class="language-plaintext highlighter-rouge">led.toggle()</code></span>
  function toggles the LED on and off
: در کد زیر، تابع <span translate="no"><code class="language-plaintext highlighter-rouge">led.toggle()</code></span>
  ، LED را روشن و خاموش می‌کند
We add a 1 second delay with the sleep(1) statement: ما با دستور sleep(1) یک تأخیر
  ۱ ثانیه‌ای اضافه می‌کنیم
? Both lines repeat indefinitely inside a <span translate="no"><code class="language-plaintext
  highlighter-rouge">while True:</code></span> code block
: هر دو خط به طور نامحدود در یک بلوک کد تکرار می‌شوند <span translate="no"><code class="language-plaintext
  highlighter-rouge">while True:</code></span>
Copy and paste the code below to the end of the blink.py file: کد زیر را کپی کرده
  و در انتهای فایل blink.py قرار دهید
If everything worked as expected, you should see an LED on the Raspberry Pi Pico blink on and off repeatedly: اگر
  همه چیز طبق انتظار پیش رفته باشد، باید یک LED روی برد Raspberry Pi Pico ببینید که
  مرتباً روشن و خاموش می‌شود
Congratulations, you have written and run your first MicroPython script: تبریک می‌گوییم،
  شما اولین اسکریپت MicroPython خود را نوشته و اجرا کرده‌اید
