Breadcrumb: خرده نان
connected to a crash sensor module with a limit switch, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک ماژول حسگر تصادف با یک سوئیچ محدودکننده، یک ماژول LED RGB و یک ماژول نمایشگر
  OLED (SSD1306) روی یک برد بورد
to change the LED color and show the status on the display when crash is detected: برای
  تغییر رنگ LED و نمایش وضعیت روی صفحه نمایش هنگام تشخیص تصادف
A crash sensor uses a limit switch: یک سنسور تصادف از یک سوئیچ محدود کننده استفاده
  می‌کند
? This can be used with a hard stop to detect when a mechanism, such as a robotic
  arm, reaches the limit of its motion and trigger a limit switch
: این می‌تواند با یک توقف سخت برای تشخیص زمانی که یک مکانیزم، مانند یک بازوی رباتیک،
  به حد حرکت خود می‌رسد و یک سوئیچ محدود کننده را فعال می‌کند، استفاده شود
It is also used in oven and refrigerator doors to turn on the internal light when the door is opened: همچنین
  در درب فر و یخچال برای روشن کردن چراغ داخلی هنگام باز شدن درب استفاده می‌شود
Create a new file in Thonny, with file name crash_sensor.py: یک فایل جدید در Thonny
  با نام crash_sensor.py ایجاد کنید
connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک ماژول حسگر ضربه با یک فنر مارپیچی، یک ماژول LED RGB و یک ماژول نمایشگر OLED
  (SSD1306) روی یک برد بورد
to change the LED color and show the status on the display when a sudden shake is detected: برای
  تغییر رنگ LED و نمایش وضعیت روی صفحه نمایش هنگام تشخیص لرزش ناگهانی
A knock sensor detects vibrations: حسگر ضربه، ارتعاشات را تشخیص می‌دهد
This particular module uses a spring-based vibration switch: این ماژول خاص از یک سوئیچ
  ارتعاشی فنری استفاده می‌کند
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: وقتی ماژول ثابت است، فنر به پین ​​مرکزی برخورد نمی‌کند، اما وقتی ضربه یا تکان می‌خورد،
  فنر تاب می‌خورد و به پین ​​مرکزی برخورد می‌کند و مدار را برای لحظه‌ای می‌بندد
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: برای
  یک ربات بالارونده از نردبان، یک حسگر ضربه می‌تواند تشخیص دهد که چه زمانی بازوی کشیده
  شده به پله نردبان برخورد می‌کند و سپس حرکت بعدی را آغاز کند
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: در
  حالی که یک حسگر تصادف باید در نقطه برخورد قرار گیرد، یک حسگر ضربه می‌تواند ارتعاشات
  را در کل بازو تشخیص دهد
? To test, run the script, then hold the entire breadboard along with the knock sensor
  in hand, and give it a big shake,bringing it to a sudden stop
: برای آزمایش، اسکریپت را اجرا کنید، سپس کل برد بورد را به همراه سنسور ضربه در دست
  بگیرید و آن را به شدت تکان دهید تا ناگهان متوقف شود
Create a new file in Thonny, with file name knock_sensor.py: یک فایل جدید در Thonny
  با نام knock_sensor.py ایجاد کنید
connected to a PIR motion sensor module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک ماژول حسگر حرکت PIR، یک ماژول LED RGB و یک ماژول نمایشگر OLED (SSD1306) روی
  یک برد بورد
to change the LED color and show the status on the display when motion is detected: برای
  تغییر رنگ LED و نمایش وضعیت روی صفحه نمایش هنگام تشخیص حرکت
A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: یک
  سنسور حرکت PIR با اندازه‌گیری تغییرات تابش مادون قرمز (گرما) ساطع شده از اشیاء اطراف،
  حرکت را تشخیص می‌دهد
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: وقتی یک جسم گرم (مانند انسان یا حیوان) در میدان حرکت می‌کند، ابتدا نیمی از حسگر
  و سپس نیمی دیگر را قطع می‌کند و یک پالس ولتاژ تفاضلی ایجاد می‌کند که حرکت را نشان
  می‌دهد
It is used in security alarms and smart home automation: در دزدگیرهای امنیتی و اتوماسیون
  خانه هوشمند استفاده می‌شود
? When running this script in a classroom, cover the sensor completely with a book
  or folded sheets of paper, then wait for sensor to reset and display <span translate="no"><code
  class="language-plaintext highlighter-rouge">No motion</code></span>
: هنگام اجرای این اسکریپت در کلاس درس، حسگر را به طور کامل با یک کتاب یا ورق‌های کاغذ
  تا شده بپوشانید، سپس منتظر بمانید تا حسگر ریست شود و <span translate="no"><code
  class="language-plaintext highlighter-rouge">No motion</code></span> را نمایش دهد
Then remove the book and wait for the sensor to detect motion: سپس کتاب را بردارید
  و صبر کنید تا حسگر حرکت را تشخیص دهد
Create a new file in Thonny, with file name motion_sensor.py: یک فایل جدید در Thonny
  با نام motion_sensor.py ایجاد کنید
connected to a photo interrupter module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک ماژول قطع کننده عکس، یک ماژول LED RGB و یک ماژول نمایشگر OLED (SSD1306) روی
  یک برد بورد
to increment the count on the display each time the photo interrupter light beam is interrupted: برای
  افزایش تعداد دفعات نمایش داده شده در صفحه نمایش هر بار که پرتو نور قطع کننده عکس
  قطع می‌شود
? A photo interrupter module sends infrared light beam from an emitter to a receiver
  (the two black blocks on the module), and detects when this beam is blocked
: یک ماژول قطع‌کننده نور، پرتو نور مادون قرمز را از یک فرستنده به یک گیرنده (دو بلوک
  سیاه روی ماژول) می‌فرستد و تشخیص می‌دهد که چه زمانی این پرتو مسدود می‌شود
It is used to detect end-of-travel in 3D printers, CNC machines and robots: برای تشخیص
  پایان مسیر در چاپگرهای سه‌بعدی، ماشین‌های CNC و ربات‌ها استفاده می‌شود
It is also used to count the pulses of a slotted disc rotating to calculate motor or wheel speed in robotics and smart cars: همچنین
  برای شمارش پالس‌های چرخش یک دیسک شیاردار برای محاسبه سرعت موتور یا چرخ در رباتیک
  و ماشین‌های هوشمند استفاده می‌شود
In a printer, it detects when a paper is present: در یک چاپگر، وقتی کاغذی وجود دارد،
  آن را تشخیص می‌دهد
Create a new file in Thonny, with file name photo_interrupter.py: یک فایل جدید در
  Thonny با نام photo_interrupter.py ایجاد کنید
connected to a photoresister module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک ماژول مقاومت نوری، یک ماژول LED RGB و یک ماژول نمایشگر OLED (SSD1306) روی
  یک برد بورد
to dim or brighten the LED to match the change in ambient light measured by the photoresister: کم
  یا زیاد کردن نور LED برای تطبیق با تغییر نور محیط اندازه‌گیری شده توسط مقاومت نوری
? A photoresister allows more electricity to flow when more light hits its surface,
  and less electricity to flow when less light hits its surface
: یک مقاومت نوری وقتی نور بیشتری به سطح آن برخورد می‌کند، اجازه عبور جریان الکتریسیته
  بیشتری را می‌دهد و وقتی نور کمتری به سطح آن برخورد می‌کند، جریان الکتریسیته کمتری
  را عبور می‌دهد
It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: برای
  کم کردن نور صفحه نمایش گوشی در نور کم و روشن کردن آن در فضای باز و زیر نور شدید
  خورشید استفاده می‌شود
Some TVs use it to dim the display to match the ambient room light, to appear like printed wall art: بعضی
  از تلویزیون‌ها از آن برای کم کردن نور صفحه نمایش برای مطابقت با نور اتاق استفاده
  می‌کنند تا مانند یک اثر هنری دیواری چاپ شده به نظر برسند
Line tracking robots use it to distinguish between a dark line and a light surface: ربات‌های
  ردیاب خط از آن برای تشخیص بین خط تیره و سطح روشن استفاده می‌کنند
Create a new file in Thonny, with file name photoresistor.py: یک فایل جدید در Thonny
  با نام photoresistor.py ایجاد کنید
connected to a micro servo motor, a potentiometer (rotation sensor) module and an OLED display module (SSD1306) on a breadboard: متصل
  به یک میکرو سروو موتور، یک ماژول پتانسیومتر (سنسور چرخش) و یک ماژول نمایشگر OLED
  (SSD1306) روی یک برد بورد
to control the angle of the servo by rotating the potentiometer knob and display it on the display: برای
  کنترل زاویه سروو موتور با چرخاندن دکمه پتانسیومتر و نمایش آن روی صفحه نمایش
Potentiometers are the dials we turn to control things like temperature or volume: پتانسیومترها
  صفحه‌هایی هستند که برای کنترل چیزهایی مانند دما یا صدا از آنها استفاده می‌کنیم
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: آنها
