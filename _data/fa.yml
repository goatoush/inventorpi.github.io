Utshaho Gupta: اوتشاهو گوپتا
FOUNDER: بنیانگذار
? Utshaho is a high school senior who has spent over 3 years designing affordable
  AI-powered smart glasses for the visually impaired and has won multiple grants to
  fund his innovation
: اوتشاهو دانش‌آموز سال آخر دبیرستان است که بیش از ۳ سال را صرف طراحی عینک‌های هوشمند
  مقرون‌به‌صرفه مبتنی بر هوش مصنوعی برای افراد کم‌بینا کرده و چندین کمک‌هزینه برای
  تأمین مالی نوآوری خود دریافت کرده است
Utshaho revels in the intersection of math and science with language and international relations: اوتشاهو
  از تلاقی ریاضیات و علوم با زبان و روابط بین‌الملل لذت می‌برد
? He is the captain of the IHOT robotics team and math club, and has also co-founded
  the school newspaper and the French MUN program
: او کاپیتان تیم رباتیک و باشگاه ریاضی IHOT است و همچنین روزنامه مدرسه و برنامه MUN
  فرانسه را تأسیس کرده است
He loves traveling, band, track and photography and he is a 3rd degree black belt in Karate: او
  عاشق سفر، گروه موسیقی، دو و میدانی و عکاسی است و کمربند مشکی دان ۳ کاراته دارد
Inspiration Behind the Initiative: الهام‌بخش این ابتکار
? Utshaho’s work on creating the “Affordable Smart Glasses for the Blind and Visually
  Impaired” is what inspired him to create <span translate="no">Inventor Pi</span>
: کار اوتشاهو در ساخت «عینک هوشمند مقرون به صرفه برای نابینایان و کم بینایان» الهام‌بخش
  او برای ساخت <span translate="no">Inventor Pi</span> بوده است
? It won the 2025 Congressional App Challenge in Georgia’s 6th Congressional District,
  and was recognized by Congresswoman Lucy McBath and Senator Jon Ossoff
: این برنامه در چالش اپلیکیشن کنگره ۲۰۲۵ در حوزه انتخابیه ششم جورجیا برنده شد و توسط
  نماینده کنگره لوسی مک‌بث و سناتور جان آساف مورد تقدیر قرار گرفت
? It was also featured in Raspberry Pi Foundation’s Worldwide Coolest Projects Online
  Showcase and won the Judges’ Pick award in Georgia
: همچنین در نمایشگاه آنلاین جالب‌ترین پروژه‌های بنیاد رزبری پای در سراسر جهان نمایش
  داده شد و جایزه منتخب داوران را در جورجیا از آن خود کرد
Won the 2025 Congressional App Challenge in Georgia’s 6th District: برنده چالش اپلیکیشن
  کنگره ۲۰۲۵ در حوزه انتخابیه ششم جورجیا شد
Featured in Raspberry Pi Foundation’s Worldwide Coolest Projects: در فهرست جالب‌ترین
  پروژه‌های جهانی بنیاد رزبری پای قرار گرفته است
Affordable Smart Glasses for the Blind and Visually Impaired on YouTube: عینک هوشمند
  مقرون به صرفه برای نابینایان و کم بینایان در یوتیوب
? Affordable Smart Glasses for the Blind and Visually Impaired won the 2025 Congressional
  App Challenge in Georgia’s 6th Congressional District
: عینک هوشمند مقرون به صرفه برای نابینایان و کم بینایان، برنده چالش اپلیکیشن کنگره
  ۲۰۲۵ در حوزه انتخابیه ششم جورجیا شد
? Affordable Smart Glasses for the Blind and Visually Impaired featured in Raspberry
