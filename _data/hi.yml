This is a companion guide to the class experiments kit shown below: यह नीचे दिखाए
  गए कक्षा प्रयोग किट के लिए एक सहायक मार्गदर्शिका है।
This is a fun hands-on way to get introduced to electronics, programming and engineering: यह
  इलेक्ट्रॉनिक्स, प्रोग्रामिंग और इंजीनियरिंग से परिचित होने का एक मजेदार और व्यावहारिक
  तरीका है।
Check your class experiments kit: अपनी कक्षा के प्रयोग किट की जाँच करें
It includes 5 identical invention kits and one additional sensors kit: इसमें 5 एक
  जैसे आविष्कार किट और एक अतिरिक्त सेंसर किट शामिल हैं।
Before we can start the experiments, we need a way to write and deploy the code to Pico: प्रयोग
  शुरू करने से पहले, हमें कोड लिखने और उसे पिको पर डिप्लॉय करने का एक तरीका चाहिए।
To do this, we will install the Thonny app, preferably on all computers, so every student can learn to use it: इसके
  लिए, हम थॉनी ऐप को सभी कंप्यूटरों पर इंस्टॉल करेंगे, ताकि हर छात्र इसका उपयोग करना
  सीख सके।
If that is not feasible, we install it on at least one computer per team: यदि यह संभव
  नहीं है, तो हम इसे प्रत्येक टीम के कम से कम एक कंप्यूटर पर स्थापित करते हैं।
If Thonny cannot be installed at all, we can use the alternate method below to run the experiments: यदि
  थॉनी को बिल्कुल भी इंस्टॉल नहीं किया जा सकता है, तो हम प्रयोगों को चलाने के लिए
  नीचे दिए गए वैकल्पिक तरीके का उपयोग कर सकते हैं।
You can streamline the process by installing Thonny app on all computers before the workshop: वर्कशॉप
  से ​​पहले सभी कंप्यूटरों पर थॉनी ऐप इंस्टॉल करके आप प्रक्रिया को सुव्यवस्थित कर
  सकते हैं।
How to Run Experiments with Thonny: थॉनी के साथ प्रयोग कैसे चलाएं
Launch Thonny App on your computer, if it is not already running: यदि आपके कंप्यूटर
  पर थॉनी ऐप पहले से नहीं चल रहा है, तो उसे लॉन्च करें।
Read the guide and the code for the experiment on this website and create a new file as described: इस
  वेबसाइट पर दिए गए निर्देश और प्रयोग के कोड को पढ़ें और बताए गए तरीके से एक नई फ़ाइल
  बनाएं।
Connect the components as described before connecting Pico to power supply: पिको को
  बिजली आपूर्ति से जोड़ने से पहले बताए गए तरीके से घटकों को कनेक्ट करें।
Verify all the connections are to the correct Pins, especially the VCC and GND connections: सभी
  कनेक्शन सही पिनों से जुड़े हैं, विशेषकर VCC और GND कनेक्शन, इसकी पुष्टि कर लें।
To end the experiment, disconnect the USB cable from Pico: प्रयोग समाप्त करने के लिए,
  USB केबल को Pico से डिस्कनेक्ट करें।
To select another experiment, repeat the steps above: दूसरा प्रयोग चुनने के लिए, ऊपर
  दिए गए चरणों को दोहराएँ।
Alternate Method to Run Experiments without Thonny: थॉनी के बिना प्रयोग चलाने की वैकल्पिक
