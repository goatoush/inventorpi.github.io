We also change the angle of a servo motor based on the distance detected: हम दूरी
  का पता लगाने के आधार पर सर्वो मोटर का कोण भी बदलते हैं।
Create a new file in Thonny, with file name distance_sensor.py: Thonny में distance_sensor.py
  नाम से एक नई फ़ाइल बनाएँ।
connected to a passive piezo buzzer, an OLED display module (SSD1306) and 6 push buttons on a breadboard: ब्रेडबोर्ड
  पर लगे पैसिव पीजो बजर, OLED डिस्प्ले मॉड्यूल (SSD1306) और 6 पुश बटन से जुड़ा हुआ
  है।
to play different musical notes on the buzzer,: बजर पर अलग-अलग संगीत सुर बजाने के
  लिए,
draw the notes and musical staff lines on the display,: डिस्प्ले पर नोट्स और म्यूजिकल
  स्टाफ की लाइनें बनाएं।
and replay as a recording after a pause: और विराम के बाद रिकॉर्डिंग के रूप में पुनः
  चलाएं।
We use the buttons to play different musical notes: हम बटनों का उपयोग करके विभिन्न
  संगीत सुर बजाते हैं।
We also learn how to draw shapes on the OLED screen to draw the notes on musical staff lines: हम
  यह भी सीखते हैं कि संगीत स्टाफ लाइनों पर नोट्स बनाने के लिए OLED स्क्रीन पर आकृतियाँ
  कैसे बनाई जाती हैं।
And when user input pauses, we replay the notes to create a fun musical instrument: और
  जब उपयोगकर्ता का इनपुट रुकता है, तो हम नोट्स को दोबारा बजाकर एक मजेदार संगीत वाद्ययंत्र
  बनाते हैं।
We read 6 different inputs for the 6 buttons: हमने 6 बटनों के लिए 6 अलग-अलग इनपुट
  पढ़े।
For this, we add some more helper functions below: इसके लिए, हम नीचे कुछ और सहायक
  फ़ंक्शन जोड़ते हैं।
With all these functions, our main loop is still easy to follow: इन सभी कार्यों के
  साथ, हमारा मुख्य लूप अभी भी आसानी से समझने योग्य है।
To put it all together, and test, create a new file in Thonny, with file name piano.py: इन
  सबको एक साथ जोड़ने और परीक्षण करने के लिए, थॉनी में piano.py नाम से एक नई फ़ाइल
  बनाएँ।
connected to an analog 2-axis thumb joystick module, 2 micro servo motors and an OLED display module (SSD1306) on a breadboard: ब्रेडबोर्ड
  पर एनालॉग 2-एक्सिस थंब जॉयस्टिक मॉड्यूल, 2 माइक्रो सर्वो मोटर्स और एक OLED डिस्प्ले
  मॉड्यूल (SSD1306) से जुड़ा हुआ है।
to control the angles of both servos using the joystick and display the angles on the OLED display: जॉयस्टिक
  का उपयोग करके दोनों सर्वो के कोणों को नियंत्रित करें और उन कोणों को OLED डिस्प्ले
  पर प्रदर्शित करें।
A joystick is often used for navigation in robots, drones, cruise ships and planes: रोबोट,
  ड्रोन, क्रूज जहाज और विमानों में नेविगेशन के लिए अक्सर जॉयस्टिक का उपयोग किया जाता
  है।
In FRC robotics, we use 2 gaming controllers, with 2 joysticks per controller: FRC
  रोबोटिक्स में, हम 2 गेमिंग कंट्रोलर का उपयोग करते हैं, जिनमें से प्रत्येक कंट्रोलर
  में 2 जॉयस्टिक होते हैं।
Each joystick includes independent X and Y axis control: प्रत्येक जॉयस्टिक में स्वतंत्र
  X और Y अक्ष नियंत्रण शामिल है।
Which  gives us a total of 8 independent axes to control the robot: इससे हमें रोबोट
  को नियंत्रित करने के लिए कुल 8 स्वतंत्र अक्ष मिलते हैं।
In this script, we control the angle of two servos using different axes of the joystick: इस
  स्क्रिप्ट में, हम जॉयस्टिक के अलग-अलग अक्षों का उपयोग करके दो सर्वो के कोण को नियंत्रित
  करते हैं।
By pressing the joystick button, we toggle the mode to Sync Angle Mode: जॉयस्टिक बटन
  दबाकर, हम मोड को सिंक एंगल मोड में बदल देते हैं।
Now we use trigonometry to calculate the angle the joystick lever makes, and set the servos to match this angle: अब
  हम त्रिकोणमिति का उपयोग करके जॉयस्टिक लीवर द्वारा बनाए गए कोण की गणना करते हैं और
  सर्वो को इस कोण के अनुरूप सेट करते हैं।
In robotics, we often use advanced mathematics to control various motions: रोबोटिक्स
  में, हम अक्सर विभिन्न गतियों को नियंत्रित करने के लिए उन्नत गणित का उपयोग करते हैं।
Create a new file in Thonny, with file name joystick_and_servos.py: Thonny में joystick_and_servos.py
  नाम से एक नई फ़ाइल बनाएँ।
Microphone Sensor and Melody: माइक्रोफ़ोन सेंसर और मेलोडी
connected to a microphone sound sensor module, a passive piezo buzzer and an OLED display module (SSD1306) on a breadboard: ब्रेडबोर्ड
  पर माइक्रोफोन साउंड सेंसर मॉड्यूल, पैसिव पीजो बजर और OLED डिस्प्ले मॉड्यूल (SSD1306)
  से जुड़ा हुआ है।
to replay the sound frequencies measured by the microphone on the buzzer and display them on the display: बज़र
  पर लगे माइक्रोफ़ोन द्वारा मापी गई ध्वनि आवृत्तियों को पुनः बजाकर डिस्प्ले पर प्रदर्शित
  करना।
? A microphone sound sensor converts environmental sound waves into electrical signals
  using a built-in microphone and an onboard processing circuit
: एक माइक्रोफोन ध्वनि सेंसर अंतर्निर्मित माइक्रोफोन और ऑनबोर्ड प्रोसेसिंग सर्किट का
  उपयोग करके पर्यावरणीय ध्वनि तरंगों को विद्युत संकेतों में परिवर्तित करता है।
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: ध्वनि
  तरंगें हवा में फैलती हैं और मॉड्यूल के माइक्रोफोन के अंदर मौजूद एक छोटे, लचीले डायाफ्राम
  से टकराती हैं।
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: डायाफ्राम
  में होने वाले उतार-चढ़ाव से ऐसे विद्युत संकेत उत्पन्न होते हैं जो ध्वनि की आवृत्ति
  और तीव्रता से मेल खाते हैं।
Run this script, and simultaneously run melody.py on a different device: इस स्क्रिप्ट
  को चलाएं और साथ ही किसी दूसरे डिवाइस पर melody.py को भी चलाएं।
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: दोनों
  उपकरणों को एक दूसरे के करीब लाएं और माइक्रोफ़ोन को सीधे उस उपकरण के बजर के ऊपर रखें
  जो धुन बजा रहा है।
If the room is not very noisy, it should pick up at least some of the notes: अगर कमरे
  में ज्यादा शोर नहीं है, तो कम से कम कुछ सुर तो सुनाई देने ही चाहिए।
Create a new file in Thonny, with file name microphone_sensor.py: Thonny में microphone_sensor.py
  नाम से एक नई फ़ाइल बनाएँ।
connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: ब्रेडबोर्ड
  पर 3-एक्सिस डिजिटल एक्सेलेरोमीटर मॉड्यूल (ADXL345) और OLED डिस्प्ले मॉड्यूल (SSD1306)
  से जुड़ा हुआ है।
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: एक्सेलेरोमीटर
  को उसके X और Y अक्षों के चारों ओर घुमाकर OLED डिस्प्ले पर 3D आकृति को बनाना और घुमाना।
An accelerometer measures acceleration around the x, y and z axis: एक त्वरणमापी x,
  y और z अक्षों के सापेक्ष त्वरण को मापता है।
In robotics, it is essential in determining the robot position and movement: रोबोटिक्स
  में, रोबोट की स्थिति और गति निर्धारित करने में यह आवश्यक है।
In this script, we draw a 3D shape, and control its rotation using the accelerometer: इस
  स्क्रिप्ट में, हम एक 3D आकृति बनाते हैं और एक्सेलेरोमीटर का उपयोग करके उसके घूर्णन
  को नियंत्रित करते हैं।
Create a new file in Thonny, with file name accelerometer.py: Thonny में accelerometer.py
  नाम से एक नई फ़ाइल बनाएँ।
