A MicroPython code example: माइक्रो पाइथन कोड का एक उदाहरण
to blink an onboard LED repeatedly: ऑनबोर्ड एलईडी को बार-बार झपकाने के लिए
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: आइए
  पिको माइक्रोकंट्रोलर पर लगे एलईडी को नियंत्रित करने के लिए एक सरल माइक्रो पाइथन
  स्क्रिप्ट से शुरुआत करें।
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: हम
  मशीन लाइब्रेरी से पिन ऑब्जेक्ट का उपयोग करके GPIO (जनरल पर्पस इनपुट आउटपुट) पिन
  तक पहुँच प्राप्त करते हैं।
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): ऑनबोर्ड
  एलईडी को GP25 पर, या &quot;LED&quot; नाम से Pin(&quot;LED&quot;) या Pin(25) के रूप
  में एक्सेस किया जा सकता है।
We use Pin.OUT to set it as an output pin: हम इसे आउटपुट पिन के रूप में सेट करने के
  लिए Pin.OUT का उपयोग करते हैं।
We will use input pins later with sensors: हम बाद में सेंसर के साथ इनपुट पिन का उपयोग
  करेंगे।
Create a new file in Thonny, with file name blink.py: Thonny में blink.py नाम से एक
  नई फ़ाइल बनाएँ।
Copy and paste the code below into the file you created: नीचे दिए गए कोड को कॉपी करके
  अपनी बनाई गई फ़ाइल में पेस्ट करें।
Now let’s add the main loop: अब मुख्य लूप जोड़ते हैं
We add a 1 second delay with the sleep(1) statement: हम sleep(1) स्टेटमेंट के साथ
  1 सेकंड का विलंब जोड़ते हैं।
Copy and paste the code below to the end of the blink.py file: नीचे दिए गए कोड को
  कॉपी करके blink.py फ़ाइल के अंत में पेस्ट करें।
Congratulations, you have written and run your first MicroPython script: बधाई हो,
  आपने अपना पहला माइक्रो पाइथन स्क्रिप्ट लिखा और चलाया है।
