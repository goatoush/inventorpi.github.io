Class Experiments Kit Contents: कक्षा प्रयोग किट की सामग्री
Teachers can run a one hour workshop with middle school students interested in STEM: शिक्षक
  विज्ञान, प्रौद्योगिकी, इंजीनियरिंग और गणित (एसटीईएम) में रुचि रखने वाले माध्यमिक
