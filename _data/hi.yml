Class Experiments Kit includes 5 identical invention kits and one Additional Sensors Kit: कक्षा
  प्रयोग किट में 5 एक समान आविष्कार किट और एक अतिरिक्त सेंसर किट शामिल हैं।
Reference slides from our first workshop are included below, which you can use as-is, or incorporate within your presentation: हमारी
  पहली कार्यशाला की संदर्भ स्लाइड नीचे दी गई हैं, जिनका आप सीधे उपयोग कर सकते हैं
  या अपनी प्रस्तुति में शामिल कर सकते हैं।
Download Slides: स्लाइड डाउनलोड करें
Please familiarize yourself with the contents of the invention kit and the Additional Sensors Kit: कृपया
  आविष्कार किट और अतिरिक्त सेंसर किट की सामग्री से खुद को परिचित कर लें।
? The Additional Sensors Kit includes reward stickers that you can distribute for
  the best creative ideas, active participation, etc
: एडिशनल सेंसर्स किट में रिवॉर्ड स्टिकर शामिल हैं जिन्हें आप बेहतरीन रचनात्मक विचारों,
  सक्रिय भागीदारी आदि के लिए वितरित कर सकते हैं।
? There are also some tiny NFC nail stickers that light up when brought near a smartphone
  with NFC (often at the back near the top center)
: कुछ छोटे-छोटे एनएफसी नेल स्टिकर भी होते हैं जो एनएफसी वाले स्मार्टफोन के पास लाने
  पर चमकने लगते हैं (अक्सर पीछे की तरफ ऊपर बीच में होते हैं)।
The first step is installing the Thonny app: पहला चरण थॉनी ऐप को इंस्टॉल करना है।
It is important for the students to learn how breadboard connections work and to be safe: छात्रों
  के लिए यह सीखना महत्वपूर्ण है कि ब्रेडबोर्ड कनेक्शन कैसे काम करते हैं और सुरक्षित
  तरीके से काम करते हैं।
The Additional Sensors Kit includes a breadboard with no backing to show how it works: एडिशनल
  सेंसर्स किट में एक ब्रेडबोर्ड शामिल है जिसमें इसके काम करने का तरीका दिखाने के लिए
  कोई सपोर्ट नहीं दिया गया है।
? There is a resettable fuse on the breadboard which disconnects the circuit in case
  a student accidentally creates a short circuit on the breadboard
: ब्रेडबोर्ड पर एक रीसेट करने योग्य फ्यूज लगा होता है जो किसी छात्र द्वारा गलती से
  ब्रेडबोर्ड पर शॉर्ट सर्किट होने की स्थिति में सर्किट को डिस्कनेक्ट कर देता है।
? The students still need to verify all connections before powering on the circuit,
  because incorrect connections to the sensors can cause permanent damage to their
  sensitive electronics, rendering them useless
: सर्किट को चालू करने से पहले छात्रों को सभी कनेक्शनों की जांच करनी होगी, क्योंकि
  सेंसरों के गलत कनेक्शन से उनके संवेदनशील इलेक्ट्रॉनिक उपकरणों को स्थायी नुकसान हो
  सकता है, जिससे वे बेकार हो जाएंगे।
? When setting up the connectors, students should disconnect the USB cable from Pico,
  and have multiple students verify the connections before connecting the USB cable
: कनेक्टर लगाते समय, छात्रों को पिको से यूएसबी केबल को डिस्कनेक्ट करना चाहिए और यूएसबी
  केबल को कनेक्ट करने से पहले कई छात्रों से कनेक्शन की जांच करवानी चाहिए।
It is useful to count the pin distance from other used pins on the board: बोर्ड पर
  उपयोग में आने वाले अन्य पिनों से पिन की दूरी गिनना उपयोगी होता है।
Safety Procedure: सुरक्षा प्रक्रिया
Power Off: बिजली बंद
Connect Components: घटकों को कनेक्ट करें
Verify Each Connection: प्रत्येक कनेक्शन को सत्यापित करें
Power On: पावर ऑन
Introduction - Learn about electronics, breadboards, safety (10-20 min): परिचय - इलेक्ट्रॉनिक्स,
  ब्रेडबोर्ड और सुरक्षा के बारे में जानें (10-20 मिनट)
Divide class into 5 teams (one per invention kit) (3-5 min): कक्षा को 5 टीमों में
  विभाजित करें (प्रत्येक आविष्कार किट के लिए एक टीम) (3-5 मिनट)
Students familiarize themselves with the invention kit components (3-5 min): छात्र
  आविष्कार किट के घटकों से परिचित होते हैं (3-5 मिनट)
Run first experiments, learning the basics (Blink, then Humidity Temp Sensor) (5-10 min): बुनियादी
  बातों को सीखते हुए पहले प्रयोग करें (ब्लिंक, फिर आर्द्रता तापमान सेंसर) (5-10 मिनट)
Run random experiments from the list, and present to other teams (20-30 min): सूची
  में से यादृच्छिक प्रयोग करें और अन्य टीमों के सामने प्रस्तुत करें (20-30 मिनट)।
Clean up and pack the kits (5-7 min): सफाई करें और किट पैक करें (5-7 मिनट)
? To facilitate running additional workshops in future, students should pack the contents
  back into the boxes the way they found them
: भविष्य में अतिरिक्त कार्यशालाओं के आयोजन को सुगम बनाने के लिए, छात्रों को डिब्बों
  की सामग्री को उसी प्रकार वापस डिब्बों में पैक कर देना चाहिए जैसे उन्हें मिली थी।
If teams have more than 3 students, they can take turns reading about an experiment and running an experiment: यदि
  टीमों में 3 से अधिक छात्र हैं, तो वे बारी-बारी से किसी प्रयोग के बारे में पढ़ सकते
  हैं और प्रयोग कर सकते हैं।
? When students borrow sensors from the Additional Sensors Kit, they should return
  the sensors after their experiment so other teams can borrow them
: जब छात्र अतिरिक्त सेंसर किट से सेंसर उधार लेते हैं, तो उन्हें प्रयोग के बाद सेंसर
  वापस कर देना चाहिए ताकि अन्य टीमें भी उन्हें उधार ले सकें।
? Some experiments work in pairs, requiring 2 teams to collaborate using two Picos
  at the same time (Microphone sensor and melody, and bluetooth advertise and scan)
: कुछ प्रयोग जोड़े में किए जाते हैं, जिनमें दो टीमों को एक ही समय में दो पिको का उपयोग
  करके सहयोग करने की आवश्यकता होती है (माइक्रोफोन सेंसर और मेलोडी, और ब्लूटूथ विज्ञापन
  और स्कैन)।
? Bluetooth advertise and scan should be a fun experiment for the entire class, where
  all the devices synchronize their LED colors to match one advertising device
: ब्लूटूथ एडवर्टाइज और स्कैन पूरी कक्षा के लिए एक मजेदार प्रयोग होना चाहिए, जिसमें
  सभी डिवाइस अपने एलईडी रंगों को एक एडवर्टाइजिंग डिवाइस से मेल खाने के लिए सिंक्रनाइज़
  करें।
