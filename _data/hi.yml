Read the guide and the code for the experiment on this website but skip creating a file: इस
  वेबसाइट पर दिए गए गाइड और प्रयोग के कोड को पढ़ें, लेकिन फ़ाइल बनाने की प्रक्रिया
  को छोड़ दें।
Toggle the switch on the battery pack to ON (Insert 3 included AA batteries first, if empty): बैटरी
  पैक पर लगे स्विच को ऑन करें (यदि बैटरी खाली है तो पहले शामिल की गई 3 AA बैटरियां
  डालें)।
"On the breadboard, press the blue button \U0001F535 once to launch the menu on the OLED screen": "ब्रेडबोर्ड
  पर, OLED स्क्रीन पर मेनू लॉन्च करने के लिए नीले बटन \U0001F535 को एक बार दबाएँ।"
"Use the yellow button \U0001F7E1 to move forward to the next experiment and green \U0001F7E2 to move back": "अगले
  प्रयोग पर जाने के लिए पीले बटन \U0001F7E1 का उपयोग करें और पीछे जाने के लिए हरे
  बटन \U0001F7E2 का उपयोग करें।"
"Once you reach the experiment you are trying to run, press the blue button \U0001F535 to launch it": "जब
  आप उस प्रयोग तक पहुँच जाएँ जिसे आप चलाना चाहते हैं, तो उसे शुरू करने के लिए नीले
  बटन \U0001F535 को दबाएँ।"
