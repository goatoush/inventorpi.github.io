A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: PIR-датчик
  движения обнаруживает движение, измеряя изменения инфракрасного (теплового) излучения,
  испускаемого окружающими объектами
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: Когда теплое тело (например, человек или животное) движется по полю, оно сначала
  пересекает одну половину датчика, а затем другую, создавая дифференциальный импульс
  напряжения, который сигнализирует о движении
It is used in security alarms and smart home automation: Он используется в системах
