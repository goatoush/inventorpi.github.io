A MicroPython code example: Пример кода на MicroPython
to blink an onboard LED repeatedly: многократно мигать встроенным светодиодом
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Начнём
  с простого скрипта на MicroPython для управления встроенным светодиодом микроконтроллера
  Pico
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: Доступ
  к выводам GPIO (General Purpose Input Output) осуществляется с помощью объекта Pin
  из библиотеки machine
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): Доступ
  к встроенному светодиоду можно получить через порт GP25, или по имени «LED» в виде
  контакта («LED») или контакта (25)
We use Pin.OUT to set it as an output pin: Мы используем Pin.OUT для установки его
  в качестве выходного контакта
We will use input pins later with sensors: Позже мы будем использовать входные контакты
  для подключения датчиков
Create a new file in Thonny, with file name blink.py: Создайте в Thonny новый файл
  с именем blink.py
Copy and paste the code below into the file you created: Скопируйте и вставьте приведенный
  ниже код в созданный вами файл
Now let’s add the main loop: Теперь добавим основной цикл
We add a 1 second delay with the sleep(1) statement: Мы добавляем задержку в 1 секунду
  с помощью оператора sleep(1)
Copy and paste the code below to the end of the blink.py file: Скопируйте и вставьте
  приведенный ниже код в конец файла blink.py
Congratulations, you have written and run your first MicroPython script: Поздравляем,
  вы написали и запустили свой первый скрипт на MicroPython!
