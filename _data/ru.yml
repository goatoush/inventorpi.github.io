  рука ударяется о ступеньку лестницы, и затем инициировать следующее движение
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: В
  то время как датчик столкновения необходимо размещать в точке удара, датчик толчка
  может обнаруживать вибрации по всей руке
Create a new file in Thonny, with file name knock_sensor.py: Создайте в Thonny новый
