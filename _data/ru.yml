It is used to detect end-of-travel in 3D printers, CNC machines and robots: Он используется
  для определения конечной точки перемещения в 3D-принтерах, станках с ЧПУ и роботах
It is also used to count the pulses of a slotted disc rotating to calculate motor or wheel speed in robotics and smart cars: Он
  также используется для подсчета импульсов вращения перфорированного диска с целью
  расчета скорости двигателя или колеса в робототехнике и умных автомобилях
In a printer, it detects when a paper is present: В принтере он определяет наличие
