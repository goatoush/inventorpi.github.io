It is also used in oven and refrigerator doors to turn on the internal light when the door is opened: Он
  также используется в дверцах духовок и холодильников для включения внутреннего освещения
  при открытии дверцы
Create a new file in Thonny, with file name crash_sensor.py: Создайте в Thonny новый
  файл с именем crash_sensor.py
connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: подключены
  к модулю датчика детонации с пружиной, модулю RGB-светодиода и модулю OLED-дисплея
  (SSD1306) на макетной плате
to change the LED color and show the status on the display when a sudden shake is detected: Изменять
  цвет светодиода и отображать состояние на дисплее при обнаружении резкого сотрясения
A knock sensor detects vibrations: Датчик детонации обнаруживает вибрации
This particular module uses a spring-based vibration switch: В этом модуле используется
  вибропереключатель на пружинном механизме
? When the module is still, the spring does not touch the center pin, but when bumped
