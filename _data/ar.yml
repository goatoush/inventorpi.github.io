Utshaho Gupta: أوتشاهو غوبتا
FOUNDER: مؤسس
? Utshaho is a high school senior who has spent over 3 years designing affordable
  AI-powered smart glasses for the visually impaired and has won multiple grants to
  fund his innovation
: أوتشاهو طالب في السنة الأخيرة من المدرسة الثانوية، وقد أمضى أكثر من 3 سنوات في تصميم
  نظارات ذكية بأسعار معقولة تعمل بتقنية الذكاء الاصطناعي للمكفوفين وضعاف البصر، وقد
  فاز بالعديد من المنح لتمويل ابتكاره
Utshaho revels in the intersection of math and science with language and international relations: يستمتع
  أوتشاهو بتقاطع الرياضيات والعلوم مع اللغة والعلاقات الدولية
? He is the captain of the IHOT robotics team and math club, and has also co-founded
  the school newspaper and the French MUN program
: هو قائد فريق الروبوتات ونادي الرياضيات في مدرسة IHOT، كما شارك في تأسيس صحيفة المدرسة
  وبرنامج نموذج الأمم المتحدة الفرنسي
He loves traveling, band, track and photography and he is a 3rd degree black belt in Karate: إنه
  يعشق السفر، والموسيقى، وألعاب القوى، والتصوير، وهو حاصل على الحزام الأسود من الدرجة
  الثالثة في الكاراتيه
Inspiration Behind the Initiative: الإلهام وراء المبادرة
? Utshaho’s work on creating the “Affordable Smart Glasses for the Blind and Visually
  Impaired” is what inspired him to create <span translate="no">Inventor Pi</span>
: إن عمل أوتشاهو على ابتكار &quot;النظارات الذكية بأسعار معقولة للمكفوفين وضعاف البصر&quot;
  هو ما ألهمه لإنشاء <span translate="no">Inventor Pi</span>
? It won the 2025 Congressional App Challenge in Georgia’s 6th Congressional District,
  and was recognized by Congresswoman Lucy McBath and Senator Jon Ossoff
: فاز التطبيق بتحدي تطبيقات الكونغرس لعام 2025 في الدائرة السادسة بولاية جورجيا، وحظي
  بتقدير عضوة الكونغرس لوسي ماكباث والسيناتور جون أوسوف
? It was also featured in Raspberry Pi Foundation’s Worldwide Coolest Projects Online
  Showcase and won the Judges’ Pick award in Georgia
: كما تم عرضه في معرض المشاريع العالمية الرائعة على الإنترنت التابع لمؤسسة راسبيري
  باي، وفاز بجائزة اختيار الحكام في جورجيا
Won the 2025 Congressional App Challenge in Georgia’s 6th District: فاز بتحدي تطبيقات
  الكونغرس لعام 2025 في الدائرة السادسة بولاية جورجيا
Featured in Raspberry Pi Foundation’s Worldwide Coolest Projects: تم إدراجه ضمن قائمة
  أروع المشاريع العالمية لمؤسسة راسبيري باي
Affordable Smart Glasses for the Blind and Visually Impaired on YouTube: نظارات ذكية
  بأسعار معقولة للمكفوفين وضعاف البصر على يوتيوب
? Affordable Smart Glasses for the Blind and Visually Impaired won the 2025 Congressional
  App Challenge in Georgia’s 6th Congressional District
: فازت النظارات الذكية ذات الأسعار المعقولة للمكفوفين وضعاف البصر بجائزة تحدي تطبيقات
  الكونغرس لعام 2025 في الدائرة السادسة بولاية جورجيا
? Affordable Smart Glasses for the Blind and Visually Impaired featured in Raspberry
  Pi Foundation's Worldwide Coolest Projects Online Showcase
: نظارات ذكية بأسعار معقولة للمكفوفين وضعاف البصر، معروضة ضمن معرض المشاريع العالمية
  الرائعة على الإنترنت التابع لمؤسسة راسبيري باي
