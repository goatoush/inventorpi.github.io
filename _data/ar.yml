A MicroPython code example: مثال على كود MicroPython
running on a Raspberry Pi Pico 2 W microcontroller: يعمل على وحدة تحكم دقيقة Raspberry
  Pi Pico 2 W
to blink an onboard LED repeatedly: لتشغيل مؤشر LED الموجود على اللوحة بشكل متكرر
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: لنبدأ
  ببرنامج نصي بسيط مكتوب بلغة مايكرو بايثون للتحكم في مؤشر LED الموجود على لوحة التحكم
  الدقيقة Pico
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: نصل
  إلى منافذ GPIO (منافذ الإدخال والإخراج للأغراض العامة) باستخدام كائن Pin من مكتبة
  الجهاز
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): يمكن
  الوصول إلى مؤشر LED الموجود على اللوحة من خلال GP25، أو الاسم &quot;LED&quot; كـ
  Pin(&quot;LED&quot;) أو Pin(25)
We use Pin.OUT to set it as an output pin: نستخدم Pin.OUT لتعيينه كدبوس إخراج
We will use input pins later with sensors: سنستخدم دبابيس الإدخال لاحقًا مع أجهزة
  الاستشعار
Create a new file in Thonny, with file name blink.py: أنشئ ملفًا جديدًا في Thonny،
  باسم blink.py
Copy and paste the code below into the file you created: انسخ والصق الكود أدناه في
  الملف الذي أنشأته
Now let’s add the main loop: والآن لنضف الحلقة الرئيسية
? In the code below, <span translate="no"><code class="language-plaintext highlighter-rouge">led.toggle()</code></span>
  function toggles the LED on and off
: في الكود أدناه، تقوم الدالة <span translate="no"><code class="language-plaintext
  highlighter-rouge">led.toggle()</code></span> بتشغيل وإطفاء مؤشر LED
We add a 1 second delay with the sleep(1) statement: نضيف تأخيرًا لمدة ثانية واحدة
  باستخدام عبارة sleep(1)
? Both lines repeat indefinitely inside a <span translate="no"><code class="language-plaintext
  highlighter-rouge">while True:</code></span> code block
: يتكرر كلا السطرين إلى ما لا نهاية داخل كتلة التعليمات البرمجية <span translate="no"><code
  class="language-plaintext highlighter-rouge">while True:</code></span>
Copy and paste the code below to the end of the blink.py file: انسخ والصق الكود أدناه
  في نهاية ملف blink.py
If everything worked as expected, you should see an LED on the Raspberry Pi Pico blink on and off repeatedly: إذا
  سارت الأمور كما هو متوقع، فسترى مؤشر LED على جهاز Raspberry Pi Pico يومض بشكل متكرر
Congratulations, you have written and run your first MicroPython script: تهانينا،
  لقد كتبت وشغلت أول برنامج نصي لك بلغة مايكرو بايثون
