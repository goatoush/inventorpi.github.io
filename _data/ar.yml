Run current script: تشغيل البرنامج النصي الحالي
connected to a crash sensor module with a limit switch, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة استشعار التصادم المزودة بمفتاح حد، ووحدة إضاءة LED RGB، ووحدة عرض OLED (SSD1306)
  على لوحة تجارب
to change the LED color and show the status on the display when crash is detected: لتغيير
  لون مؤشر LED وعرض الحالة على الشاشة عند اكتشاف عطل
A crash sensor uses a limit switch: يستخدم مستشعر التصادم مفتاح حد
? This can be used with a hard stop to detect when a mechanism, such as a robotic
  arm, reaches the limit of its motion and trigger a limit switch
: يمكن استخدام هذا مع نقطة توقف صارمة لاكتشاف متى تصل آلية ما، مثل ذراع روبوتية، إلى
  حدود حركتها وتفعيل مفتاح الحد
It is also used in oven and refrigerator doors to turn on the internal light when the door is opened: كما
  يُستخدم في أبواب الأفران والثلاجات لتشغيل الإضاءة الداخلية عند فتح الباب
Create a new file in Thonny, with file name crash_sensor.py: أنشئ ملفًا جديدًا في
  Thonny، باسم crash_sensor.py
connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة استشعار الصدمات المزودة بنابض حلزوني، ووحدة إضاءة LED RGB، ووحدة عرض OLED
  (SSD1306) على لوحة تجارب
to change the LED color and show the status on the display when a sudden shake is detected: لتغيير
  لون مؤشر LED وعرض الحالة على الشاشة عند اكتشاف اهتزاز مفاجئ
A knock sensor detects vibrations: يستشعر مستشعر الصدمات الاهتزازات
This particular module uses a spring-based vibration switch: تستخدم هذه الوحدة تحديدًا
  مفتاح اهتزاز قائم على زنبرك
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: عندما تكون الوحدة ثابتة، لا يلامس الزنبرك الدبوس المركزي، ولكن عند تعرضها للصدم
  أو الاهتزاز، يتأرجح الزنبرك ويضرب الدبوس المركزي، مما يؤدي إلى إغلاق الدائرة الكهربائية
  مؤقتًا
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: بالنسبة
  لروبوت تسلق السلالم، يمكن لمستشعر الصدمات اكتشاف متى يصطدم ذراع ممتد بإحدى درجات
  السلم، ثم يبدأ الحركة التالية
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: بينما
  يتطلب الأمر وضع مستشعر التصادم عند نقطة الاصطدام، يمكن لمستشعر الصدمات اكتشاف الاهتزازات
  عبر ذراع كامل
? To test, run the script, then hold the entire breadboard along with the knock sensor
  in hand, and give it a big shake,bringing it to a sudden stop
: للاختبار، شغّل البرنامج النصي، ثم أمسك لوحة التجارب بأكملها مع مستشعر الصدمات بيدك،
  وهزّها بقوة حتى تتوقف فجأة
Create a new file in Thonny, with file name knock_sensor.py: أنشئ ملفًا جديدًا في
  Thonny، باسم knock_sensor.py
connected to a PIR motion sensor module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة استشعار حركة PIR، ووحدة LED RGB، ووحدة عرض OLED (SSD1306) على لوحة تجارب
to change the LED color and show the status on the display when motion is detected: لتغيير
  لون مؤشر LED وعرض الحالة على الشاشة عند اكتشاف الحركة
A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: يستشعر
  مستشعر الحركة بالأشعة تحت الحمراء السلبية الحركة عن طريق قياس التغيرات في الإشعاع
  تحت الأحمر (الحراري) المنبعث من الأجسام المحيطة
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: عندما يتحرك جسم دافئ (مثل الإنسان أو الحيوان) عبر المجال، فإنه يعترض نصف المستشعر
  أولاً ثم النصف الآخر، مما يخلق نبضة جهد تفاضلي تشير إلى الحركة
It is used in security alarms and smart home automation: يُستخدم في أنظمة الإنذار
  الأمني ​​وأنظمة التشغيل الآلي للمنازل الذكية
? When running this script in a classroom, cover the sensor completely with a book
  or folded sheets of paper, then wait for sensor to reset and display <span translate="no"><code
  class="language-plaintext highlighter-rouge">No motion</code></span>
: عند تشغيل هذا البرنامج النصي في الفصل الدراسي، قم بتغطية المستشعر بالكامل بكتاب
  أو أوراق مطوية، ثم انتظر حتى تتم إعادة ضبط المستشعر وعرض <span translate="no"><code
  class="language-plaintext highlighter-rouge">No motion</code></span>
Then remove the book and wait for the sensor to detect motion: ثم أزل الكتاب وانتظر
  حتى يستشعر المستشعر الحركة
Create a new file in Thonny, with file name motion_sensor.py: أنشئ ملفًا جديدًا في
  Thonny، باسم motion_sensor.py
connected to a photo interrupter module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة مقاطعة ضوئية، ووحدة LED RGB، ووحدة عرض OLED (SSD1306) على لوحة تجارب
to increment the count on the display each time the photo interrupter light beam is interrupted: لزيادة
  العدد على الشاشة في كل مرة يتم فيها مقاطعة شعاع ضوء جهاز فصل الصور
? A photo interrupter module sends infrared light beam from an emitter to a receiver
  (the two black blocks on the module), and detects when this beam is blocked
: تقوم وحدة مقاطعة الضوء بإرسال شعاع ضوء الأشعة تحت الحمراء من باعث إلى مستقبل (الكتلتان
  السوداوان على الوحدة)، وتكتشف متى يتم حجب هذا الشعاع
It is used to detect end-of-travel in 3D printers, CNC machines and robots: يُستخدم
  هذا النظام للكشف عن نهاية مسار الحركة في الطابعات ثلاثية الأبعاد، وآلات التحكم الرقمي
  الحاسوبي، والروبوتات
It is also used to count the pulses of a slotted disc rotating to calculate motor or wheel speed in robotics and smart cars: كما
  يُستخدم لحساب نبضات قرص مشقوق يدور لحساب سرعة المحرك أو العجلة في الروبوتات والسيارات
  الذكية
In a printer, it detects when a paper is present: في الطابعة، يكتشف وجود الورق
Create a new file in Thonny, with file name photo_interrupter.py: أنشئ ملفًا جديدًا
  في Thonny، باسم photo_interrupter.py
connected to a photoresister module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة مقاومة ضوئية، ووحدة LED RGB، ووحدة عرض OLED (SSD1306) على لوحة تجارب
to dim or brighten the LED to match the change in ambient light measured by the photoresister: لخفض
  أو زيادة سطوع الصمام الثنائي الباعث للضوء (LED) بما يتناسب مع التغير في الإضاءة
  المحيطة الذي يقيسه المقاوم الضوئي
? A photoresister allows more electricity to flow when more light hits its surface,
  and less electricity to flow when less light hits its surface
: تسمح المقاومة الضوئية بتدفق المزيد من الكهرباء عندما يسقط المزيد من الضوء على سطحها،
  وتدفق أقل للكهرباء عندما يسقط القليل من الضوء على سطحها
It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: يُستخدم
  لتعتيم شاشة الهاتف في الإضاءة المنخفضة، وزيادتها عند التواجد في الهواء الطلق تحت
  أشعة الشمس الساطعة
Some TVs use it to dim the display to match the ambient room light, to appear like printed wall art: تستخدم
  بعض أجهزة التلفاز هذه الخاصية لتعتيم الشاشة لتتناسب مع إضاءة الغرفة المحيطة، لتبدو
  كلوحة جدارية مطبوعة
Line tracking robots use it to distinguish between a dark line and a light surface: تستخدم
  روبوتات تتبع الخطوط هذه التقنية للتمييز بين الخط الداكن والسطح الفاتح
Create a new file in Thonny, with file name photoresistor.py: أنشئ ملفًا جديدًا في
  Thonny، باسم photoresistor.py
connected to a micro servo motor, a potentiometer (rotation sensor) module and an OLED display module (SSD1306) on a breadboard: متصل
  بمحرك سيرفو صغير، ووحدة مقياس جهد (مستشعر دوران)، ووحدة عرض OLED (SSD1306) على لوحة
  تجارب
to control the angle of the servo by rotating the potentiometer knob and display it on the display: للتحكم
  في زاوية المحرك المؤازر عن طريق تدوير مقبض مقياس الجهد وعرضها على الشاشة
Potentiometers are the dials we turn to control things like temperature or volume: المقاييس
  الجهدية هي الأقراص التي نديرها للتحكم في أشياء مثل درجة الحرارة أو مستوى الصوت
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: تعمل
  هذه الأجهزة عن طريق تغيير المقاومة الكهربائية، والتي نقرأها على أنها جهد متغير عند
  دبوس الإدخال الخاص بوحدة التحكم الدقيقة
In this script, we use this input to control a servo angle: في هذا البرنامج النصي،
  نستخدم هذا الإدخال للتحكم في زاوية المؤازرة
A servo is a motor where we can control the rotation angle by changing the PWM signal we send to it: المحرك
  المؤازر هو محرك يمكننا من خلاله التحكم في زاوية الدوران عن طريق تغيير إشارة تعديل
  عرض النبضة (PWM) التي نرسلها إليه
Unlike standard electric motors that spin continuously, a servo motor moves to an exact angle or position and holds it firmly: بخلاف
  المحركات الكهربائية القياسية التي تدور باستمرار، يتحرك محرك السيرفو إلى زاوية أو
  موضع محدد ويثبته بإحكام
Create a new file in Thonny, with file name potentiometer_and_servo.py: أنشئ ملفًا
  جديدًا في Thonny، باسم potentiometer_and_servo.py
Bluetooth Advertise and Bluetooth Scan: الإعلان عن البلوتوث ومسح البلوتوث
connected to a rotary encoder module, an RGB LED and an OLED display module (SSD1306) on a breadboard: متصلة
  بوحدة تشفير دوارة، ومصباح LED ثلاثي الألوان، ووحدة عرض OLED (SSD1306) على لوحة تجارب
to individually control the red, green and blue channels of the LED to create any color,: للتحكم
