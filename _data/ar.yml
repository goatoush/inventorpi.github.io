Introduction - Learn about electronics, breadboards, safety (10-20 min): مقدمة - التعرف
  على الإلكترونيات، ولوحات التجارب، والسلامة (10-20 دقيقة)
Divide class into 5 teams (one per invention kit) (3-5 min): قسّم الفصل إلى 5 فرق
  (فريق واحد لكل مجموعة أدوات اختراع) (3-5 دقائق)
Students familiarize themselves with the invention kit components (3-5 min): يتعرف
  الطلاب على مكونات مجموعة الاختراع (3-5 دقائق)
Run first experiments, learning the basics (Blink, then Humidity Temp Sensor) (5-10 min): قم
  بإجراء التجارب الأولية، وتعلم الأساسيات (وميض، ثم مستشعر درجة الحرارة والرطوبة)
  (5-10 دقائق)
Run random experiments from the list, and present to other teams (20-30 min): قم بإجراء
  تجارب عشوائية من القائمة، وقدمها للفرق الأخرى (20-30 دقيقة)
Clean up and pack the kits (5-7 min): تنظيف وتعبئة الأدوات (5-7 دقائق)
? To facilitate running additional workshops in future, students should pack the contents
  back into the boxes the way they found them
: لتسهيل إقامة ورش عمل إضافية في المستقبل، ينبغي على الطلاب إعادة تعبئة المحتويات
  في الصناديق بنفس الطريقة التي وجدوها بها
If teams have more than 3 students, they can take turns reading about an experiment and running an experiment: إذا
  كان عدد الطلاب في الفريق أكثر من 3، فيمكنهم التناوب على قراءة معلومات عن التجربة
  وإجراء التجربة
? When students borrow sensors from the Additional Sensors Kit, they should return
  the sensors after their experiment so other teams can borrow them
: عندما يستعير الطلاب أجهزة استشعار من مجموعة أجهزة الاستشعار الإضافية، يجب عليهم
  إعادتها بعد انتهاء تجربتهم حتى تتمكن الفرق الأخرى من استعارتها
