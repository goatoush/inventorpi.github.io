: كما توجد بعض ملصقات الأظافر الصغيرة بتقنية NFC التي تضيء عند تقريبها من هاتف ذكي
  مزود بتقنية NFC (غالباً في الجزء الخلفي بالقرب من المنتصف العلوي)
The first step is installing the Thonny app: الخطوة الأولى هي تثبيت تطبيق ثوني
It is important for the students to learn how breadboard connections work and to be safe: من
  المهم أن يتعلم الطلاب كيفية عمل توصيلات لوحة التجارب وأن يكونوا آمنين
The Additional Sensors Kit includes a breadboard with no backing to show how it works: تتضمن
  مجموعة المستشعرات الإضافية لوحة تجارب بدون غطاء خلفي لتوضيح كيفية عملها
? There is a resettable fuse on the breadboard which disconnects the circuit in case
  a student accidentally creates a short circuit on the breadboard
: يوجد في لوحة التجارب مصهر قابل لإعادة الضبط يفصل الدائرة في حال تسبب الطالب عن طريق
  الخطأ في حدوث ماس كهربائي على لوحة التجارب
? The students still need to verify all connections before powering on the circuit,
  because incorrect connections to the sensors can cause permanent damage to their
  sensitive electronics, rendering them useless
: لا يزال يتعين على الطلاب التحقق من جميع التوصيلات قبل تشغيل الدائرة، لأن التوصيلات
  غير الصحيحة لأجهزة الاستشعار يمكن أن تتسبب في تلف دائم لأجهزتهم الإلكترونية الحساسة،
  مما يجعلها عديمة الفائدة
? When setting up the connectors, students should disconnect the USB cable from Pico,
  and have multiple students verify the connections before connecting the USB cable
: عند إعداد الموصلات، يجب على الطلاب فصل كابل USB عن جهاز Pico، وأن يقوم عدة طلاب
  بالتحقق من التوصيلات قبل توصيل كابل USB
It is useful to count the pin distance from other used pins on the board: من المفيد
  حساب المسافة بين الدبابيس المستخدمة على اللوحة
