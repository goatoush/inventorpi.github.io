A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: একটি
  পিআইআর মোশন সেন্সর আশেপাশের বস্তু থেকে নির্গত ইনফ্রারেড (তাপ) বিকিরণের পরিবর্তন
  পরিমাপ করে নড়াচড়া শনাক্ত করে।
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: যখন কোনো উষ্ণ বস্তু (যেমন মানুষ বা প্রাণী) ক্ষেত্রটির উপর দিয়ে চলাচল করে, তখন এটি
