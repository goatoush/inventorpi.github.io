  সার্কিট ব্যবহার করে পারিপার্শ্বিক শব্দ তরঙ্গকে বৈদ্যুতিক সংকেতে রূপান্তরিত করে।
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: শব্দ
  তরঙ্গ বাতাসের মধ্য দিয়ে গিয়ে মডিউলের মাইক্রোফোনের ভেতরে থাকা একটি ক্ষুদ্র নমনীয়
  ডায়াফ্রামে আঘাত করে।
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: ডায়াফ্রামের
  ওঠানামা এমন বৈদ্যুতিক সংকেত তৈরি করে যা শব্দের কম্পাঙ্ক এবং তীব্রতার সাথে মিলে যায়।
Run this script, and simultaneously run melody.py on a different device: এই স্ক্রিপ্টটি
  চালান এবং একই সাথে অন্য একটি ডিভাইসে melody.py চালান।
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: ডিভাইস
  দুটিকে একে অপরের কাছাকাছি আনুন এবং যে ডিভাইসটিতে সুর বাজছে, তার বাজারের ঠিক উপরে
  মাইক্রোফোনটি রাখুন।
If the room is not very noisy, it should pick up at least some of the notes: ঘরটি
  খুব বেশি কোলাহলপূর্ণ না হলে, এটি অন্তত কিছু সুর ধরতে পারবে।
Create a new file in Thonny, with file name microphone_sensor.py: Thonny-তে microphone_sensor.py
  নামে একটি নতুন ফাইল তৈরি করুন।
connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: একটি
  ব্রেডবোর্ডে ৩-অক্ষ ডিজিটাল অ্যাক্সেলেরোমিটার মডিউল (ADXL345) এবং একটি OLED ডিসপ্লে
  মডিউল (SSD1306)-এর সাথে সংযুক্ত।
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: অ্যাক্সেলেরোমিটারকে
  এর X এবং Y অক্ষ বরাবর ঘুরিয়ে OLED ডিসপ্লেতে একটি ত্রিমাত্রিক আকৃতি আঁকা এবং ঘোরানো।
An accelerometer measures acceleration around the x, y and z axis: একটি অ্যাক্সেলেরোমিটার
  x, y এবং z অক্ষ বরাবর ত্বরণ পরিমাপ করে।
In robotics, it is essential in determining the robot position and movement: রোবোটিক্সে,
  রোবটের অবস্থান এবং গতিবিধি নির্ধারণের জন্য এটি অপরিহার্য।
In this script, we draw a 3D shape, and control its rotation using the accelerometer: এই
  স্ক্রিপ্টে আমরা একটি ত্রিমাত্রিক আকৃতি আঁকি এবং অ্যাক্সেলেরোমিটার ব্যবহার করে এর
  ঘূর্ণন নিয়ন্ত্রণ করি।
Create a new file in Thonny, with file name accelerometer.py: Thonny-তে accelerometer.py
  নামে একটি নতুন ফাইল তৈরি করুন।
Write your first script “blink.py” by following the instructions below: নিচের নির্দেশাবলী
  অনুসরণ করে আপনার প্রথম স্ক্রিপ্ট “blink.py” লিখুন।
Once you get it to work on your Pico, try connecting the humidity and temperature sensor in the next experiment: একবার
  আপনার পিকো-তে এটি কাজ করাতে পারলে, পরবর্তী পরীক্ষায় আর্দ্রতা এবং তাপমাত্রা সেন্সরটি
  সংযোগ করার চেষ্টা করুন।
After that, try random experiments from the list below: এরপর, নিচের তালিকা থেকে এলোমেলোভাবে
  পরীক্ষাগুলো করে দেখুন।
Some experiments need additional sensors from the common additional sensors kit to be shared by all teams: কিছু
  পরীক্ষার জন্য সাধারণ অতিরিক্ত সেন্সর কিট থেকে অতিরিক্ত সেন্সরের প্রয়োজন হয়, যা
  সকল দল ভাগ করে ব্যবহার করতে পারে।
The complete code for all the experiments is also available on: সমস্ত পরীক্ষার সম্পূর্ণ
  কোড এখানেও পাওয়া যাবে।
