  ঝাঁকুনি শনাক্ত হলে LED-র রঙ পরিবর্তন করতে এবং ডিসপ্লেতে অবস্থা দেখাতে।
A knock sensor detects vibrations: একটি নক সেন্সর কম্পন শনাক্ত করে।
This particular module uses a spring-based vibration switch: এই নির্দিষ্ট মডিউলটিতে
  একটি স্প্রিং-ভিত্তিক ভাইব্রেশন সুইচ ব্যবহার করা হয়েছে।
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: মডিউলটি স্থির থাকলে স্প্রিংটি মাঝের পিনটিকে স্পর্শ করে না, কিন্তু ধাক্কা লাগলে বা
  ঝাঁকালে স্প্রিংটি নড়ে ওঠে এবং মাঝের পিনটিতে আঘাত করে ক্ষণিকের জন্য বর্তনীটি বন্ধ
  করে দেয়।
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: মই
  বেয়ে ওঠা রোবটের ক্ষেত্রে, একটি নক সেন্সর শনাক্ত করতে পারে কখন তার প্রসারিত বাহু
  মইয়ের কোনো ধাপে আঘাত করে, এবং তারপর পরবর্তী গতি শুরু করতে পারে।
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: যেখানে
  একটি ক্র্যাশ সেন্সরকে আঘাতের স্থানে স্থাপন করতে হয়, সেখানে একটি নক সেন্সর একটি
  বাহুর সম্পূর্ণ অংশ জুড়ে কম্পন শনাক্ত করতে পারে।
