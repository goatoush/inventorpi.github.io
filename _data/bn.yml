A MicroPython code example: একটি মাইক্রোপাইথন কোডের উদাহরণ
to blink an onboard LED repeatedly: অনবোর্ড এলইডি বারবার জ্বালাতে ও নেভাতে
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: চলুন
  পিকো মাইক্রোকন্ট্রোলারের অনবোর্ড এলইডি নিয়ন্ত্রণ করার জন্য একটি সহজ মাইক্রোপাইথন
  স্ক্রিপ্ট দিয়ে শুরু করা যাক।
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: আমরা
  মেশিন লাইব্রেরির Pin অবজেক্ট ব্যবহার করে GPIO (General Purpose Input Output) পিনগুলো
  অ্যাক্সেস করি।
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): অনবোর্ড
  LED-টি GP25-এ, অথবা Pin(“LED”) বা Pin(25) হিসেবে “LED” নামে অ্যাক্সেস করা যাবে।
We use Pin.OUT to set it as an output pin: আমরা এটিকে আউটপুট পিন হিসেবে সেট করতে Pin.OUT
  ব্যবহার করি।
We will use input pins later with sensors: আমরা পরে সেন্সরগুলির সাথে ইনপুট পিন ব্যবহার
  করব।
Create a new file in Thonny, with file name blink.py: Thonny-তে blink.py নামে একটি
  নতুন ফাইল তৈরি করুন।
Copy and paste the code below into the file you created: আপনার তৈরি করা ফাইলে নিচের
  কোডটি কপি করে পেস্ট করুন।
Now let’s add the main loop: এবার মূল লুপটি যোগ করা যাক।
We add a 1 second delay with the sleep(1) statement: আমরা sleep(1) স্টেটমেন্টের মাধ্যমে
  1 সেকেন্ডের ডিলে যোগ করি।
Copy and paste the code below to the end of the blink.py file: নিচের কোডটি কপি করে
  blink.py ফাইলের শেষে পেস্ট করুন।
Congratulations, you have written and run your first MicroPython script: অভিনন্দন,
  আপনি আপনার প্রথম মাইক্রোপাইথন স্ক্রিপ্টটি লিখেছেন এবং চালিয়েছেন।
