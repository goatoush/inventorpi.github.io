  সহ-প্রতিষ্ঠাতা।
He loves traveling, band, track and photography and he is a 3rd degree black belt in Karate: তিনি
  ভ্রমণ, ব্যান্ড, ট্র্যাক ও ফটোগ্রাফি ভালোবাসেন এবং তিনি কারাতেতে তৃতীয় ডিগ্রি ব্ল্যাক
  বেল্টধারী।
