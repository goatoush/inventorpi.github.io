Breadboard is a solderless way to connect electronic components for prototyping: প্রোটোটাইপিংয়ের
  জন্য ইলেকট্রনিক উপাদান সংযোগ করার একটি ঝালাইবিহীন উপায় হলো ব্রেডবোর্ড।
? Horizontal holes are linked together, but not across the middle divider <span translate="no"><img
  src="/assets/images/breadboard-horizontal-holes.webp?v=8bd9en" alt="Horizontal holes
  are linked together" class="inline-img" /></span>
: অনুভূমিক ছিদ্রগুলো একে অপরের সাথে সংযুক্ত, কিন্তু মাঝের বিভাজকটির আড়াআড়িভাবে নয়।
  <span translate="no"><img src="/assets/images/breadboard-horizontal-holes.webp?v=8bd9en"
  alt="অনুভূমিক ছিদ্রগুলি একসাথে সংযুক্ত করা হয়" class="inline-img" /></span>
? Vertical bus strips are continuous down the side of the board, but don’t cross the
  middle divider <span translate="no"><img src="/assets/images/breadboard-vertical-strips.webp?v=bt35l0"
  alt="Vertical bus strips are linked together" class="inline-img" /></span>
: উল্লম্ব বাস স্ট্রিপগুলো বোর্ডের পাশ বরাবর অবিচ্ছিন্নভাবে বিস্তৃত, কিন্তু মাঝের বিভাজকটি
  অতিক্রম করে না। <span translate="no"><img src="/assets/images/breadboard-vertical-strips.webp?v=bt35l0"
  alt="উল্লম্ব বাস স্ট্রিপগুলি একসাথে সংযুক্ত করা হয়" class="inline-img" /></span>
You can see exactly which holes are connected to each other if you look behind a breadboard without the adhesive backing: আঠালো
  আবরণ ছাড়া একটি ব্রেডবোর্ডের পিছনে তাকালে আপনি স্পষ্টভাবে দেখতে পাবেন কোন ছিদ্রগুলো
  একে অপরের সাথে সংযুক্ত।
Study the breadboard included in the additional sensors kit, where the adhesive backing has been removed: অতিরিক্ত
  সেন্সর কিটের সাথে অন্তর্ভুক্ত ব্রেডবোর্ডটি ভালোভাবে দেখুন, যেখানকার আঠালো আস্তরণটি
  সরানো হয়েছে।
Be gentle as the metal contacts are loose and might fall out of the breadboard: সাবধানে
  কাজ করুন, কারণ ধাতব সংযোগগুলো আলগা এবং ব্রেডবোর্ড থেকে খুলে পড়ে যেতে পারে।
