This is a fun hands-on way to get introduced to electronics, programming and engineering: ইলেকট্রনিক্স,
  প্রোগ্রামিং এবং ইঞ্জিনিয়ারিংয়ের সাথে পরিচিত হওয়ার এটি একটি মজাদার ও হাতে-কলমে
  শেখার উপায়।
Check your class experiments kit: আপনার ক্লাসের পরীক্ষামূলক কিটটি পরীক্ষা করুন
It includes 5 identical invention kits and one additional sensors kit: এতে ৫টি অভিন্ন
  উদ্ভাবনী কিট এবং একটি অতিরিক্ত সেন্সর কিট অন্তর্ভুক্ত রয়েছে।
Before we can start the experiments, we need a way to write and deploy the code to Pico: পরীক্ষাগুলো
  শুরু করার আগে, আমাদের পিকো-তে কোড লেখা এবং স্থাপন করার একটি উপায় প্রয়োজন।
To do this, we will install the Thonny app, preferably on all computers, so every student can learn to use it: এর
  জন্য, আমরা থনি (Thonny) অ্যাপটি ইনস্টল করব, বিশেষ করে সব কম্পিউটারে, যাতে প্রত্যেক
  শিক্ষার্থী এটি ব্যবহার করতে শিখতে পারে।
If that is not feasible, we install it on at least one computer per team: যদি তা সম্ভব
  না হয়, তাহলে আমরা প্রতিটি দলের অন্তত একটি কম্পিউটারে এটি ইনস্টল করি।
If Thonny cannot be installed at all, we can use the alternate method below to run the experiments: যদি
  থনি কোনোভাবেই ইনস্টল করা না যায়, তাহলে এক্সপেরিমেন্টগুলো চালানোর জন্য আমরা নিচের
  বিকল্প পদ্ধতিটি ব্যবহার করতে পারি।
You can streamline the process by installing Thonny app on all computers before the workshop: কর্মশালার
  আগে সমস্ত কম্পিউটারে থনি অ্যাপ ইনস্টল করে আপনি প্রক্রিয়াটিকে আরও সহজ করতে পারেন।
How to Run Experiments with Thonny: থনির সাথে কীভাবে পরীক্ষা চালাবেন
