to increment the count on the display each time the photo interrupter light beam is interrupted: 每次光電中斷器光束中斷時，顯示幕上的計數增加。
? A photo interrupter module sends infrared light beam from an emitter to a receiver
  (the two black blocks on the module), and detects when this beam is blocked
: 光電斷路器模組會將紅外線光束從發射器發送到接收器（模組上的兩個黑色方塊），並偵測該光束何時被遮蔽。
It is used to detect end-of-travel in 3D printers, CNC machines and robots: 它用於檢測3D列印機、CNC機床和機器人的行程終點。
It is also used to count the pulses of a slotted disc rotating to calculate motor or wheel speed in robotics and smart cars: 它也用於計算旋轉的開槽圓盤的脈衝數，從而計算機器人和智慧汽車中的馬達或車輪速度。
In a printer, it detects when a paper is present: 印表機可以偵測紙張是否存在。
