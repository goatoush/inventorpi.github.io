connected to a PIR motion sensor module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: 在麵包板上連接
  PIR 運動感測器模組、RGB LED 模組和 OLED 顯示模組 (SSD1306)。
to change the LED color and show the status on the display when motion is detected: 偵測到運動時，改變
  LED 燈顏色並在顯示幕上顯示狀態。
A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: PIR運動感測器透過測量周圍物體發出的紅外線（熱）輻射的變化來檢測運動。
? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: 當一個溫暖的物體（例如人或動物）穿過感測器區域時，它會先與感測器的一半接觸，然後再與另一半接觸，從而產生一個差分電壓脈衝，該脈衝指示了運動情況。
It is used in security alarms and smart home automation: 它用於安全警報和智慧家庭自動化。
Then remove the book and wait for the sensor to detect motion: 然後移開書，等待感測器偵測到運動。
