Microphone Sensor and Melody: 麥克風感應器和旋律
connected to a microphone sound sensor module, a passive piezo buzzer and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接麥克風聲音感測器模組、被動壓電蜂鳴器和OLED顯示模組（SSD1306）。
to replay the sound frequencies measured by the microphone on the buzzer and display them on the display: 重播蜂鳴器上麥克風測量的聲音頻率，並將其顯示在螢幕上。
? A microphone sound sensor converts environmental sound waves into electrical signals
  using a built-in microphone and an onboard processing circuit
: 麥克風聲音感測器利用內建麥克風和板載處理電路，將環境聲波轉換為電訊號。
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: 聲波在空氣中傳播，並撞擊模組麥克風內部的微型柔性振膜。
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: 隔膜的波動會產生與聲音頻率和音量相符的電訊號。
Run this script, and simultaneously run melody.py on a different device: 執行此腳本，同時在另一台裝置上執行
  melody.py。
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: 將兩個裝置靠近，並將麥克風直接放在播放旋律的裝置的蜂鳴器上方。
If the room is not very noisy, it should pick up at least some of the notes: 如果房間不太吵鬧，它應該至少可以拿起一些音符。
Create a new file in Thonny, with file name microphone_sensor.py: 在 Thonny 中建立一個名為
  microphone_sensor.py 的新檔案。
connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接到三軸數位加速度計模組
  (ADXL345) 和 OLED 顯示模組 (SSD1306)。
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: 透過繞著
  X 軸和 Y 軸旋轉加速度計，在 OLED 顯示器上繪製和旋轉 3D 形狀。
An accelerometer measures acceleration around the x, y and z axis: 加速度計測量繞 x、y 和 z
  軸的加速度
In robotics, it is essential in determining the robot position and movement: 在機器人學中，確定機器人的位置和運動至關重要。
In this script, we draw a 3D shape, and control its rotation using the accelerometer: 在這個腳本中，我們繪製一個三維形狀，並使用加速度計控制其旋轉。
Create a new file in Thonny, with file name accelerometer.py: 在 Thonny 中建立一個名為 accelerometer.py
