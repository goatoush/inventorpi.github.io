: 當一台裝置執行 bluetooth_advertise.py，而附近多台裝置執行 bluetooth_scan.py 時，我們就可以建立一個同步裝置網路。
This is how a cluster of robots can communicate and work together: 這就是一群機器人如何進行通訊和協同工作的方式。
