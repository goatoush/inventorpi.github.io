connected to a micro servo motor, a potentiometer (rotation sensor) module and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接微型伺服馬達、電位器（旋轉感測器）模組和OLED顯示模組（SSD1306）。
to control the angle of the servo by rotating the potentiometer knob and display it on the display: 透過旋轉電位器旋鈕來控制伺服馬達的角度，並在顯示器上顯示該角度。
Potentiometers are the dials we turn to control things like temperature or volume: 電位器就是我們用來控制溫度或音量等參數的旋鈕。
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: 它們的工作原理是改變電阻，而電阻的變化則表現為微控制器輸入引腳上的電壓變化。
In this script, we use this input to control a servo angle: 在這個腳本中，我們使用此輸入來控制伺服角度
A servo is a motor where we can control the rotation angle by changing the PWM signal we send to it: 伺服馬達是一種可以透過改變發送給它的PWM訊號來控制其旋轉角度的馬達。
Unlike standard electric motors that spin continuously, a servo motor moves to an exact angle or position and holds it firmly: 與持續旋轉的普通電動馬達不同，伺服馬達可以精確地移動到特定角度或位置並保持穩定。
