connected to a photoresister module, an RGB LED module and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接到光敏電阻模組、RGB
  LED 模組和 OLED 顯示模組 (SSD1306)。
to dim or brighten the LED to match the change in ambient light measured by the photoresister: 根據光敏電阻測量的環境光變化，調整
  LED 的亮度或亮度。
? A photoresister allows more electricity to flow when more light hits its surface,
  and less electricity to flow when less light hits its surface
: 光敏電阻表面受光量越大，通過的電流就越大；受光量越小，通過的電流就越小。
It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: 它用於在光線較暗的環境下調暗手機螢幕，並在戶外陽光強烈時調亮螢幕。
Some TVs use it to dim the display to match the ambient room light, to appear like printed wall art: 有些電視利用這項技術來調暗螢幕，使其與室內環境光線相匹配，看起來就像印刷在牆上的藝術品一樣。
Line tracking robots use it to distinguish between a dark line and a light surface: 循線機器人利用它來區分深色線條和淺色表面。
