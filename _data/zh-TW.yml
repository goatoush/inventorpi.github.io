  alt="正軌" class="inline-img"></span>鐵路）到 GND（ <span translate="no"><img src="/assets/images/minus-rail.webp?v=osszao"
  alt="地面軌道" class="inline-img"></span>軌道），它跳閘，防止電子設備損壞。
Notice that Ground (GND) pins are repeated after every 4 pins, and start after 2 pins in each end: 請注意，接地
  (GND) 引腳每隔 4 個引腳重複出現一次，並且在每端都從第 2 個引腳之後開始。
