Important Do’s and Don’ts: 重要須知與禁忌
Do …: 做 …
Disconnect Pico before changing connectors: 更換連接器前，請先中斷 Pico 的連接。
Verify all connections, especially VCC and GND: 檢查所有連接，特別是 VCC 和 GND 連接。
Establish team roles like coding, wiring, verifying circuit, capturing notes and recording: 明確團隊角色，例如編碼、接線、電路驗證、記錄筆記和錄製。
Read experiment description and code: 閱讀實驗說明和程式碼
Don’t …: 不 …
Don’t power on before verifying all connections: 請勿在確認所有連接前開機。
Incorrect VCC and GND can destroy sensitive electronics: VCC 和 GND 接錯可能會損壞敏感電子元件。
Don’t rely on numbers printed on the breadboard: 不要依賴麵包板上印刷的數字。
Count point distance from other connectors on the board to verify: 計算該點到板上其他連接器的距離以進行驗證
Don’t leave before putting everything back in the kit box: 離開前請務必把所有東西放回工具包裡。
