connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接到一個帶有螺旋彈簧的爆震感測器模組、一個RGB
  LED模組和一個OLED顯示模組（SSD1306）。
to change the LED color and show the status on the display when a sudden shake is detected: 當偵測到突然搖晃時，改變
  LED 指示燈顏色並在顯示器上顯示狀態。
A knock sensor detects vibrations: 爆震感知器用於檢測振動。
This particular module uses a spring-based vibration switch: 這個模組採用了一種基於彈簧的振動開關。
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: 當模組靜止時，彈簧不會接觸中心引腳；但當受到碰撞或搖晃時，彈簧會擺動並撞擊中心引腳，從而瞬間閉合電路。
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: 對於爬梯機器人而言，敲擊感應器可以偵測到伸出的機械手臂何時碰到梯級，然後啟動下一個動作。
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: 碰撞感測器需要安裝在撞擊點，而敲擊感測器則可以偵測整個手臂的振動。
