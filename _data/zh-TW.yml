  alt="垂直母線相互連接" class="inline-img" /></span>
You can see exactly which holes are connected to each other if you look behind a breadboard without the adhesive backing: 如果您查看沒有背膠的麵包板背面，您可以清楚地看到哪些孔是相互連接的。
Study the breadboard included in the additional sensors kit, where the adhesive backing has been removed: 仔細觀察附加感測器套件中包含的麵包板，其背面的黏合劑已被移除。
Be gentle as the metal contacts are loose and might fall out of the breadboard: 操作時請輕柔，因為金屬觸點鬆動，可能會從麵包板上脫落。
