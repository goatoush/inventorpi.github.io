A MicroPython code example: MicroPython 程式碼範例
to blink an onboard LED repeatedly: 反覆閃爍板載 LED 燈
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: 我們先從一個簡單的MicroPython腳本開始，用來控制Pico微控制器上的板載LED。
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: 我們使用機器庫中的
  Pin 物件來存取 GPIO（通用輸入輸出）引腳。
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): 板載
  LED 可透過 GP25 訪問，或使用名稱“LED”作為 Pin(“LED”) 或 Pin(25) 進行存取。
We use Pin.OUT to set it as an output pin: 我們使用 Pin.OUT 將其設定為輸出引腳
We will use input pins later with sensors: 稍後我們將使用輸入引腳連接感測器。
Create a new file in Thonny, with file name blink.py: 在 Thonny 中建立一個名為 blink.py 的新檔案。
Copy and paste the code below into the file you created: 將以下程式碼複製並貼上到您建立的文件中。
Now let’s add the main loop: 現在我們來加入主循環
We add a 1 second delay with the sleep(1) statement: 我們使用 sleep(1) 語句來新增 1 秒的延遲。
Copy and paste the code below to the end of the blink.py file: 將以下程式碼複製並貼上到 blink.py
  檔案的末尾。
Congratulations, you have written and run your first MicroPython script: 恭喜，您已經編寫並執行了您的第一個
  MicroPython 腳本。
