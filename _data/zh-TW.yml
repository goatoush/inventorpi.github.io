  alt="水平孔相互連通" class="inline-img" /></span>
? Vertical bus strips are continuous down the side of the board, but don’t cross the
  middle divider <span translate="no"><img src="/assets/images/breadboard-vertical-strips.webp?v=bt35l0"
  alt="Vertical bus strips are linked together" class="inline-img" /></span>
