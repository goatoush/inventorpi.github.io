connected to a capacitive touch sensor module, a passive piezo buzzer, and an OLED display module (SSD1306) on a breadboard: 在麵包板上，​​連接到電容式觸控感應器模組、被動式壓電蜂鳴器和OLED顯示模組（SSD1306）。
to create a reaction time testing game,: 創建一個反應時間測試遊戲，
and to learn to draw shapes on the OLED display: 並學習在OLED顯示器上繪製形狀
A capacitive touch sensor detects a touch by measuring changes in electrical charge when a human finger comes close: 電容式觸摸感測器透過測量人手指靠近時產生的電荷變化來檢測觸摸。
Humans are full of water and salt, making the body a natural conductor of electricity: 人體充滿水和鹽，這使得人體成為天然的導電體。
It is used in smartphones for multi-touch navigation and gesture detection: 它用於智慧型手機的多點觸控導航和手勢檢測。
In this script, we create a short game to test your reaction time, while also learning how to draw shapes on the OLED screen: 在這個腳本中，我們創建了一個小遊戲來測試你的反應速度，同時學習如何在OLED螢幕上繪製形狀。
'To read the sensor, we run:': 要讀取感測器數據，我們運行：
The function below draws happy or sad face based on the parameters passed to it: 以下函數根據傳遞給它的參數繪製笑臉或哭臉。
The main loop of our game is easy to follow because it calls easy to understand function names: 我們遊戲的主循環很容易理解，因為它呼叫了易於理解的函數名稱。
Create a new file in Thonny, with file name touch_game.py: 在 Thonny 中建立一個名為 touch_game.py
  的新檔案。
? connected to an ultrasonic distance sensor module (HC-SR04), a micro servo motor,
  a passive piezo buzzer, an RGB LED module, and an OLED display module (SSD1306)
  on a breadboard
: 在麵包板上，​​連接了超音波距離感測器模組（HC-SR04）、微型伺服馬達、被動壓電蜂鳴器、RGB LED模組和OLED顯示模組（SSD1306）。
? to create a gesture based sound instrument that converts the distance measured to
  different buzzer sound frequencies, servo angles and LED colors, and displays the
  distance measured on the OLED display
: 創建一個基於手勢的聲音樂器，該樂器可以將測量的距離轉換為不同的蜂鳴器聲音頻率、伺服角度和 LED 顏色，並在 OLED 顯示器上顯示測量的距離。
A distance sensor measures the distance to any nearby obstruction: 距離感測器測量到附近障礙物的距離。
Robots and cars use such sensors to stop before hitting any obstruction: 機器人和汽車利用這類感測器在撞到障礙物之前停下來。
The sensor used here is an ultrasonic distance sensor: 這裡使用的感測器是超音波測距感測器。
? We convert the distance to different RGB colors and buzzer frequencies to create
  a fun musical instrument that you can play with hand gestures
: 我們將距離轉換成不同的RGB顏色和蜂鳴器頻率，創造出一種可以用手勢演奏的趣味樂器。
We also change the angle of a servo motor based on the distance detected: 我們也會根據偵測到的距離來改變伺服馬達的角度。
Create a new file in Thonny, with file name distance_sensor.py: 在 Thonny 中建立一個名為 distance_sensor.py
  的新檔案。
connected to a passive piezo buzzer, an OLED display module (SSD1306) and 6 push buttons on a breadboard: 連接到麵包板上的被動壓電蜂鳴器、OLED
  顯示模組 (SSD1306) 和 6 個按鈕。
to play different musical notes on the buzzer,: 用蜂鳴器演奏不同的音符，
draw the notes and musical staff lines on the display,: 在顯示幕上畫出音符和五線譜，
and replay as a recording after a pause: 暫停後以錄音形式重播
We use the buttons to play different musical notes: 我們用這些按鈕來演奏不同的音符
We also learn how to draw shapes on the OLED screen to draw the notes on musical staff lines: 我們也會學習如何在OLED螢幕上繪製形狀，以便在五線譜上畫出音符。
And when user input pauses, we replay the notes to create a fun musical instrument: 當使用者輸入暫停時，我們會重新播放音符，從而創造出有趣的樂器。
We read 6 different inputs for the 6 buttons: 我們讀取了6個按鈕的6個不同輸入
For this, we add some more helper functions below: 為此，我們在下面添加一些輔助函數。
With all these functions, our main loop is still easy to follow: 有了這些功能，我們的主循環仍然很容易理解。
To put it all together, and test, create a new file in Thonny, with file name piano.py: 為了將所有內容整合在一起並進行測試，請在
  Thonny 中建立一個名為 piano.py 的新檔案。
connected to an analog 2-axis thumb joystick module, 2 micro servo motors and an OLED display module (SSD1306) on a breadboard: 連接到麵包板上的類比雙軸拇指搖桿模組、2個微型伺服馬達和一個OLED顯示模組（SSD1306）。
to control the angles of both servos using the joystick and display the angles on the OLED display: 使用操縱桿控制兩個舵機的角度，並在
  OLED 顯示器上顯示角度。
A joystick is often used for navigation in robots, drones, cruise ships and planes: 操縱桿常用於機器人、無人機、遊輪和飛機的導航。
In FRC robotics, we use 2 gaming controllers, with 2 joysticks per controller: 在FRC機器人比賽中，我們使用兩個遊戲控制器，每個控制器有兩個操縱桿。
Each joystick includes independent X and Y axis control: 每個操縱桿均包含獨立的 X 軸和 Y 軸控制功能
Which  gives us a total of 8 independent axes to control the robot: 這樣我們就總共有了8個獨立的軸來控制機器人。
In this script, we control the angle of two servos using different axes of the joystick: 在這個腳本中，我們使用操縱桿的不同軸來控制兩個舵機的角度。
By pressing the joystick button, we toggle the mode to Sync Angle Mode: 按下操縱桿按鈕，即可將模式切換到同步角度模式。
Now we use trigonometry to calculate the angle the joystick lever makes, and set the servos to match this angle: 現在我們利用三角函數計算操縱桿的角度，並將伺服馬達調整到與該角度相符的程度。
In robotics, we often use advanced mathematics to control various motions: 在機器人學中，我們經常使用高等數學來控制各種運動。
Create a new file in Thonny, with file name joystick_and_servos.py: 在 Thonny 中建立一個名為
