to blink an onboard LED repeatedly: at blinke en indbygget LED gentagne gange
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Lad
  os starte med et simpelt micropython-script til at styre den indbyggede LED på Pico-mikrocontrolleren
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: Vi
  tilgår GPIO (General Purpose Input Output) pins ved at bruge Pin-objektet fra maskinbiblioteket
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): Den
  indbyggede LED kan tilgås ved GP25, eller navnet &quot;LED&quot; som Pin(&quot;LED&quot;)
  eller Pin(25)
We use Pin.OUT to set it as an output pin: Vi bruger Pin.OUT til at indstille den
  som en output-pin
We will use input pins later with sensors: Vi bruger input-pins senere med sensorer
Create a new file in Thonny, with file name blink.py: Opret en ny fil i Thonny med
  filnavnet blink.py
Copy and paste the code below into the file you created: Kopier og indsæt koden nedenfor
  i den fil, du har oprettet
Now let’s add the main loop: Lad os nu tilføje hovedløkken
We add a 1 second delay with the sleep(1) statement: Vi tilføjer en forsinkelse på
  1 sekund med sleep(1)-sætningen
Copy and paste the code below to the end of the blink.py file: Kopier og indsæt koden
  nedenfor i slutningen af ​​blink.py-filen
If everything worked as expected, you should see an LED on the Raspberry Pi Pico blink on and off repeatedly: Hvis
  alt fungerede som forventet, burde du se en LED på Raspberry Pi Pico blinke gentagne
  gange
Congratulations, you have written and run your first MicroPython script: Tillykke,
  du har skrevet og kørt dit første MicroPython-script
