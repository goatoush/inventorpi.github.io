: Når eleverne låner sensorer fra ekstra sensorsættet, skal de returnere sensorerne
  efter deres eksperiment, så andre hold kan låne dem
? Some experiments work in pairs, requiring 2 teams to collaborate using two Picos
  at the same time (Microphone sensor and melody, and bluetooth advertise and scan)
: Nogle eksperimenter fungerer parvis, hvilket kræver, at 2 hold samarbejder om to
  Pico&#39;er på samme tid (mikrofonsensor og melodi samt Bluetooth-reklame og -scanning)
? Bluetooth advertise and scan should be a fun experiment for the entire class, where
  all the devices synchronize their LED colors to match one advertising device
: Bluetooth-reklame og -scanning burde være et sjovt eksperiment for hele klassen,
  hvor alle enheder synkroniserer deres LED-farver, så de matcher én reklameenhed
You could direct one team to work on Bluetooth advertise and others to setup Bluetooth scan before time runs out: Du
