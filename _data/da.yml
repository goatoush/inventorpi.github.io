Divide class into 5 teams (one per invention kit) (3-5 min): Del klassen op i 5 hold
  (et hold pr. opfindelsessæt) (3-5 min.)
Students familiarize themselves with the invention kit components (3-5 min): Eleverne
  gør sig bekendt med komponenterne i opfindelsessættet (3-5 min.)
Run first experiments, learning the basics (Blink, then Humidity Temp Sensor) (5-10 min): Kør
  de første eksperimenter, og lær det grundlæggende (blink, derefter fugtighedstemperatursensor)
  (5-10 min)
Run random experiments from the list, and present to other teams (20-30 min): Kør
  tilfældige eksperimenter fra listen, og præsenter dem for andre hold (20-30 min)
Clean up and pack the kits (5-7 min): Ryd op og pak sættene (5-7 min)
? To facilitate running additional workshops in future, students should pack the contents
  back into the boxes the way they found them
: For at gøre det lettere at afholde yderligere workshops i fremtiden, bedes eleverne
  pakke indholdet tilbage i kasserne, som de modtog det
