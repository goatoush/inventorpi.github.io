A MicroPython code example: Un esempio di codice MicroPython
to blink an onboard LED repeatedly: far lampeggiare ripetutamente un LED integrato
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Iniziamo
  con un semplice script MicroPython per controllare il LED integrato nel microcontrollore
  Pico
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: Accediamo
  ai pin GPIO (General Purpose Input Output) utilizzando l&#39;oggetto Pin dalla libreria
  della macchina
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): Il
  LED integrato è accessibile tramite GP25, oppure tramite il nome &quot;LED&quot;
  come Pin(&quot;LED&quot;) o Pin(25)
We use Pin.OUT to set it as an output pin: Utilizziamo Pin.OUT per impostarlo come
  pin di uscita
We will use input pins later with sensors: In seguito utilizzeremo i pin di input
  con i sensori
Create a new file in Thonny, with file name blink.py: Crea un nuovo file in Thonny,
  con il nome blink.py
Copy and paste the code below into the file you created: Copia e incolla il codice
  seguente nel file che hai creato
Now let’s add the main loop: Ora aggiungiamo il ciclo principale
We add a 1 second delay with the sleep(1) statement: Aggiungiamo un ritardo di 1 secondo
  con l&#39;istruzione sleep(1)
Copy and paste the code below to the end of the blink.py file: Copia e incolla il
  codice seguente alla fine del file blink.py
Congratulations, you have written and run your first MicroPython script: Congratulazioni,
  hai scritto ed eseguito il tuo primo script MicroPython
