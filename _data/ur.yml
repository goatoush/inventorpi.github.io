A MicroPython code example: مائیکرو پیتھون کوڈ کی مثال
running on a Raspberry Pi Pico 2 W microcontroller: Raspberry Pi Pico 2 W مائکروکنٹرولر
  پر چل رہا ہے۔
to blink an onboard LED repeatedly: آن بورڈ ایل ای ڈی کو بار بار جھپکنا
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: آئیے
  پیکو مائیکرو کنٹرولر پر آن بورڈ ایل ای ڈی کو کنٹرول کرنے کے لیے ایک سادہ مائیکرو
  پیتھون اسکرپٹ کے ساتھ شروع کریں
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: ہم
  مشین لائبریری سے پن آبجیکٹ کا استعمال کرکے GPIO (جنرل پرپز ان پٹ آؤٹ پٹ) پنوں تک
  رسائی حاصل کرتے ہیں۔
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): آن
  بورڈ LED تک GP25 پر رسائی حاصل کی جا سکتی ہے، یا &quot;LED&quot; کا نام بطور پن
  (&quot;LED&quot;) یا پن (25)
We use Pin.OUT to set it as an output pin: ہم اسے آؤٹ پٹ پن کے طور پر سیٹ کرنے کے
  لیے Pin.OUT کا استعمال کرتے ہیں۔
We will use input pins later with sensors: ہم بعد میں سینسر کے ساتھ ان پٹ پن استعمال
  کریں گے۔
Create a new file in Thonny, with file name blink.py: تھونی میں ایک نئی فائل بنائیں،
  فائل کا نام blink.py کے ساتھ
Copy and paste the code below into the file you created: نیچے دیے گئے کوڈ کو اپنی
  بنائی ہوئی فائل میں کاپی اور پیسٹ کریں۔
Now let’s add the main loop: اب مین لوپ کو شامل کرتے ہیں۔
? In the code below, <span translate="no"><code class="language-plaintext highlighter-rouge">led.toggle()</code></span>
  function toggles the LED on and off
: نیچے کے کوڈ میں، <span translate="no"><code class="language-plaintext highlighter-rouge">led.toggle()</code></span>
  فنکشن LED کو آن اور آف کرتا ہے۔
We add a 1 second delay with the sleep(1) statement: ہم نیند (1) بیان کے ساتھ 1 سیکنڈ
  کی تاخیر کا اضافہ کرتے ہیں۔
? Both lines repeat indefinitely inside a <span translate="no"><code class="language-plaintext
  highlighter-rouge">while True:</code></span> code block
: دونوں لائنیں کچھ <span translate="no"><code class="language-plaintext highlighter-rouge">while
  True:</code></span> کوڈ بلاک
Copy and paste the code below to the end of the blink.py file: نیچے دیئے گئے کوڈ کو
  کاپی اور blink.py فائل کے آخر میں پیسٹ کریں۔
If everything worked as expected, you should see an LED on the Raspberry Pi Pico blink on and off repeatedly: اگر
  سب کچھ توقع کے مطابق کام کرتا ہے، تو آپ کو Raspberry Pi Pico پر ایک LED بار بار
  آن اور آف نظر آنی چاہیے۔
Congratulations, you have written and run your first MicroPython script: مبارک ہو،
  آپ نے اپنا پہلا MicroPython اسکرپٹ لکھا اور چلا لیا ہے۔
