A crash sensor uses a limit switch: کریش سینسر ایک حد سوئچ کا استعمال کرتا ہے۔
? This can be used with a hard stop to detect when a mechanism, such as a robotic
  arm, reaches the limit of its motion and trigger a limit switch
: اس کا پتہ لگانے کے لیے مشکل اسٹاپ کے ساتھ استعمال کیا جا سکتا ہے جب کوئی میکانزم،
