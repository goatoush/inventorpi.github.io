? When a warm body (like a human or animal) moves across the field, it intercepts
  one half of the sensor first and then the other, creating a differential voltage
  pulse that signals motion
: جب ایک گرم جسم (جیسے انسان یا جانور) میدان کے اس پار حرکت کرتا ہے، تو یہ پہلے سینسر
  کے ایک آدھے حصے کو روکتا ہے اور پھر دوسرے کو، ایک تفریق وولٹیج پلس بناتا ہے جو حرکت
  کا اشارہ دیتا ہے۔
It is used in security alarms and smart home automation: یہ سیکیورٹی الارم اور سمارٹ
  ہوم آٹومیشن میں استعمال ہوتا ہے۔
? When running this script in a classroom, cover the sensor completely with a book
