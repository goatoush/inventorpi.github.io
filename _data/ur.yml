Utshaho Gupta: اُتشاہو گپتا
FOUNDER: بانی
? Utshaho is a high school senior who has spent over 3 years designing affordable
  AI-powered smart glasses for the visually impaired and has won multiple grants to
  fund his innovation
: Utshaho ایک ہائی اسکول کا سینئر ہے جس نے نابینا افراد کے لیے سستی AI سے چلنے والے
  سمارٹ شیشے ڈیزائن کرنے میں 3 سال سے زیادہ وقت گزارا ہے اور اپنی اختراع کو فنڈ دینے
  کے لیے متعدد گرانٹس جیتا ہے۔
Utshaho revels in the intersection of math and science with language and international relations: Utshaho
  زبان اور بین الاقوامی تعلقات کے ساتھ ریاضی اور سائنس کے چوراہے میں revels
? He is the captain of the IHOT robotics team and math club, and has also co-founded
  the school newspaper and the French MUN program
: وہ IHOT روبوٹکس ٹیم اور ریاضی کلب کا کپتان ہے، اور اس نے اسکول کے اخبار اور فرانسیسی
  MUN پروگرام کی بھی مشترکہ بنیاد رکھی ہے۔
He loves traveling, band, track and photography and he is a 3rd degree black belt in Karate: اسے
  سفر، بینڈ، ٹریک اور فوٹو گرافی پسند ہے اور وہ کراٹے میں تھرڈ ڈگری بلیک بیلٹ ہے۔
Inspiration Behind the Initiative: پہل کے پیچھے الہام
? Utshaho’s work on creating the “Affordable Smart Glasses for the Blind and Visually
  Impaired” is what inspired him to create <span translate="no">Inventor Pi</span>
: '&quot;نابینا اور بصارت سے محروم افراد کے لیے سستی سمارٹ شیشے&quot; بنانے پر اُتشاہو
  کا کام وہی ہے جس نے انہیں <span translate="no">Inventor Pi</span> بنانے کی ترغیب
  دی۔'
? It won the 2025 Congressional App Challenge in Georgia’s 6th Congressional District,
  and was recognized by Congresswoman Lucy McBath and Senator Jon Ossoff
: اس نے جارجیا کے 6 ویں کانگریشنل ڈسٹرکٹ میں 2025 کانگریشنل ایپ چیلنج جیتا، اور اسے
  کانگریس وومن لوسی میک باتھ اور سینیٹر جون اوسوف نے تسلیم کیا۔
? It was also featured in Raspberry Pi Foundation’s Worldwide Coolest Projects Online
  Showcase and won the Judges’ Pick award in Georgia
: اسے Raspberry Pi Foundation کے ورلڈ وائیڈ بہترین پروجیکٹس آن لائن شوکیس میں بھی
  نمایاں کیا گیا اور جارجیا میں ججز پک ایوارڈ جیتا۔
