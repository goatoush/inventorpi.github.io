A PIR motion sensor detects movement by measuring changes in infrared (heat) radiation emitted by surrounding objects: ایک
  PIR موشن سینسر ارد گرد کی اشیاء سے خارج ہونے والی انفراریڈ (گرمی) تابکاری میں تبدیلیوں
