  ہے۔
It is also used in oven and refrigerator doors to turn on the internal light when the door is opened: یہ
  تندور اور ریفریجریٹر کے دروازوں میں بھی استعمال ہوتا ہے تاکہ دروازہ کھلنے پر اندرونی
  روشنی کو آن کیا جا سکے۔
