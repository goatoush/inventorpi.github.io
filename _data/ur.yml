A knock sensor detects vibrations: ایک دستک سینسر کمپن کا پتہ لگاتا ہے۔
This particular module uses a spring-based vibration switch: یہ خاص ماڈیول بہار پر
  مبنی وائبریشن سوئچ کا استعمال کرتا ہے۔
? When the module is still, the spring does not touch the center pin, but when bumped
  or shaken, the spring sways and hits the center pin closing the circuit momentarily
: جب ماڈیول ساکن ہوتا ہے، اسپرنگ سینٹر پن کو نہیں چھوتا، لیکن جب ٹکرایا جاتا ہے یا
  ہل جاتا ہے، تو اسپرنگ سرکٹ کو لمحہ بہ لمحہ بند کرتے ہوئے سنٹر پن سے ٹکرا جاتا ہے۔
For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: سیڑھی
  پر چڑھنے والے روبوٹ کے لیے، دستک کا سینسر اس بات کا پتہ لگا سکتا ہے کہ جب ایک بڑھا
  ہوا بازو سیڑھی کی دھار سے ٹکراتا ہے، اور پھر اگلی حرکت شروع کر سکتا ہے۔
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: جبکہ
  ایک کریش سینسر کو اثر کے مقام پر رکھنے کی ضرورت ہوگی، ایک دستک سینسر پورے بازو میں
  کمپن کا پتہ لگا سکتا ہے۔
? To test, run the script, then hold the entire breadboard along with the knock sensor
  in hand, and give it a big shake,bringing it to a sudden stop
: جانچنے کے لیے، اسکرپٹ کو چلائیں، پھر دستک کے سینسر کے ساتھ پورے بریڈ بورڈ کو ہاتھ
  میں پکڑیں، اور اسے ایک بڑا جھٹکا دیں، اسے اچانک رکنے پر لے آئیں۔
