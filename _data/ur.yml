connected to a knock sensor module with a coiled spring, an RGB LED module and an OLED display module (SSD1306) on a breadboard: ایک
  کوائلڈ اسپرنگ کے ساتھ ایک دستک سینسر ماڈیول سے منسلک، ایک RGB LED ماڈیول اور ایک
  OLED ڈسپلے ماڈیول (SSD1306) ایک بریڈ بورڈ پر
to change the LED color and show the status on the display when a sudden shake is detected: ایل
