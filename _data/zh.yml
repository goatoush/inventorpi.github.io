? connected to an ultrasonic distance sensor module (HC-SR04), a micro servo motor,
  a passive piezo buzzer, an RGB LED module, and an OLED display module (SSD1306)
  on a breadboard
: 在面包板上，连接了超声波距离传感器模块（HC-SR04）、微型伺服电机、无源压电蜂鸣器、RGB LED模块和OLED显示模块（SSD1306）。
? to create a gesture based sound instrument that converts the distance measured to
  different buzzer sound frequencies, servo angles and LED colors, and displays the
  distance measured on the OLED display
: 创建一个基于手势的声音乐器，该乐器可以将测量的距离转换为不同的蜂鸣器声音频率、伺服角度和 LED 颜色，并在 OLED 显示屏上显示测量的距离。
A distance sensor measures the distance to any nearby obstruction: 距离传感器测量到附近障碍物的距离。
Robots and cars use such sensors to stop before hitting any obstruction: 机器人和汽车利用这类传感器在撞到障碍物之前停下来。
The sensor used here is an ultrasonic distance sensor: 这里使用的传感器是超声波测距传感器。
? We convert the distance to different RGB colors and buzzer frequencies to create
  a fun musical instrument that you can play with hand gestures
: 我们将距离转换成不同的RGB颜色和蜂鸣器频率，创造出一种可以用手势演奏的趣味乐器。
We also change the angle of a servo motor based on the distance detected: 我们还会根据检测到的距离来改变伺服电机的角度。
Create a new file in Thonny, with file name distance_sensor.py: 在 Thonny 中创建一个名为 distance_sensor.py
  的新文件。
connected to a passive piezo buzzer, an OLED display module (SSD1306) and 6 push buttons on a breadboard: 连接到面包板上的无源压电蜂鸣器、OLED
  显示模块 (SSD1306) 和 6 个按钮。
to play different musical notes on the buzzer,: 用蜂鸣器演奏不同的音符，
draw the notes and musical staff lines on the display,: 在显示屏上画出音符和五线谱，
and replay as a recording after a pause: 暂停后以录音形式重播
We use the buttons to play different musical notes: 我们用这些按钮来演奏不同的音符
We also learn how to draw shapes on the OLED screen to draw the notes on musical staff lines: 我们还会学习如何在OLED屏幕上绘制形状，以便在五线谱上画出音符。
And when user input pauses, we replay the notes to create a fun musical instrument: 当用户输入暂停时，我们会重新播放音符，从而创造出一种有趣的乐器。
We read 6 different inputs for the 6 buttons: 我们读取了6个按钮的6个不同输入
For this, we add some more helper functions below: 为此，我们在下面添加一些辅助函数。
With all these functions, our main loop is still easy to follow: 有了这些功能，我们的主循环仍然很容易理解。
