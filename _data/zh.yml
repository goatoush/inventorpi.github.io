Important Do’s and Don’ts: 重要须知和禁忌
Do …: 做 …
Disconnect Pico before changing connectors: 更换连接器前，请先断开 Pico 的连接。
Verify all connections, especially VCC and GND: 检查所有连接，特别是 VCC 和 GND 连接。
Establish team roles like coding, wiring, verifying circuit, capturing notes and recording: 明确团队角色，例如编码、接线、电路验证、记录笔记和录制。
Read experiment description and code: 阅读实验说明和代码
Don’t …: 不 …
Don’t power on before verifying all connections: 请勿在确认所有连接之前开机。
Incorrect VCC and GND can destroy sensitive electronics: VCC 和 GND 接错可能会损坏敏感电子元件。
Don’t rely on numbers printed on the breadboard: 不要依赖面包板上印刷的数字。
Count point distance from other connectors on the board to verify: 计算该点到板上其他连接器的距离以进行验证
Don’t leave before putting everything back in the kit box: 离开前请务必把所有东西都放回工具包里。
