connected to a micro servo motor, a potentiometer (rotation sensor) module and an OLED display module (SSD1306) on a breadboard: 在面包板上，连接着微型伺服电机、电位器（旋转传感器）模块和OLED显示模块（SSD1306）。
to control the angle of the servo by rotating the potentiometer knob and display it on the display: 通过旋转电位器旋钮来控制伺服电机的角度，并在显示屏上显示该角度。
Potentiometers are the dials we turn to control things like temperature or volume: 电位器就是我们用来控制温度或音量等参数的旋钮。
They work by varying the electrical resistance, which we read as varying voltage at a microcontroller’s input pin: 它们的工作原理是改变电阻，而电阻的变化则表现为微控制器输入引脚上的电压变化。
In this script, we use this input to control a servo angle: 在这个脚本中，我们使用此输入来控制伺服角度
A servo is a motor where we can control the rotation angle by changing the PWM signal we send to it: 伺服电机是一种可以通过改变发送给它的PWM信号来控制其旋转角度的电机。
Unlike standard electric motors that spin continuously, a servo motor moves to an exact angle or position and holds it firmly: 与持续旋转的普通电动机不同，伺服电机可以精确地移动到特定角度或位置并保持稳定。
