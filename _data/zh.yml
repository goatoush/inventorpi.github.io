Microphone Sensor and Melody: 麦克风传感器和旋律
connected to a microphone sound sensor module, a passive piezo buzzer and an OLED display module (SSD1306) on a breadboard: 在面包板上，连接着麦克风声音传感器模块、无源压电蜂鸣器和OLED显示模块（SSD1306）。
to replay the sound frequencies measured by the microphone on the buzzer and display them on the display: 重放蜂鸣器上麦克风测量的声音频率，并将其显示在屏幕上。
? A microphone sound sensor converts environmental sound waves into electrical signals
  using a built-in microphone and an onboard processing circuit
: 麦克风声音传感器利用内置麦克风和板载处理电路，将环境声波转换为电信号。
Sound waves move through the air and hit a tiny flexible diaphragm inside the module’s microphone: 声波在空气中传播，并撞击模块麦克风内部的微型柔性振膜。
The fluctuations in the diaphragm create electrical signals that match the sound frequency and volume: 隔膜的波动会产生与声音频率和音量相匹配的电信号。
Run this script, and simultaneously run melody.py on a different device: 运行此脚本，同时在另一台设备上运行
  melody.py。
Bring the devices close to each other and place the microphone directly on top of the buzzer of the device playing the melody: 将两个设备靠近，并将麦克风直接放在播放旋律的设备的蜂鸣器上方。
If the room is not very noisy, it should pick up at least some of the notes: 如果房间不太吵闹，它应该至少能拾取到一些音符。
Create a new file in Thonny, with file name microphone_sensor.py: 在 Thonny 中创建一个名为
