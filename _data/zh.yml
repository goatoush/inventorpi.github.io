For a ladder climbing robot, a knock sensor could detect when an extending arm hits a ladder rung, and then initiate next motion: 对于爬梯机器人而言，敲击传感器可以检测到伸出的机械臂何时碰到梯级，然后启动下一个动作。
While a crash sensor would need to be placed at the point of impact, a knock sensor could detect vibrations across an entire arm: 碰撞传感器需要安装在撞击点，而敲击传感器则可以检测整个手臂的振动。
