A MicroPython code example: MicroPython 代码示例
to blink an onboard LED repeatedly: 反复闪烁板载 LED 灯
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: 我们先从一个简单的MicroPython脚本开始，用来控制Pico微控制器上的板载LED。
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: 我们使用机器库中的
  Pin 对象来访问 GPIO（通用输入输出）引脚。
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): 板载
  LED 可通过 GP25 访问，或使用名称“LED”作为 Pin(“LED”) 或 Pin(25) 进行访问。
We use Pin.OUT to set it as an output pin: 我们使用 Pin.OUT 将其设置为输出引脚
We will use input pins later with sensors: 稍后我们将使用输入引脚连接传感器。
Create a new file in Thonny, with file name blink.py: 在 Thonny 中创建一个名为 blink.py 的新文件。
Copy and paste the code below into the file you created: 将以下代码复制并粘贴到您创建的文件中。
Now let’s add the main loop: 现在我们来添加主循环
We add a 1 second delay with the sleep(1) statement: 我们使用 sleep(1) 语句添加 1 秒的延迟。
Copy and paste the code below to the end of the blink.py file: 将以下代码复制并粘贴到 blink.py
  文件的末尾。
Congratulations, you have written and run your first MicroPython script: 恭喜，您已经编写并运行了您的第一个
  MicroPython 脚本。
