connected to a 3-axis digital accelerometer module (ADXL345) and an OLED display module (SSD1306) on a breadboard: 在面包板上，连接到三轴数字加速度计模块
  (ADXL345) 和 OLED 显示模块 (SSD1306)。
to draw and rotate a 3D shape on the OLED display by rotating the accelerometer about its X and Y axes: 通过绕
  X 轴和 Y 轴旋转加速度计，在 OLED 显示屏上绘制和旋转 3D 形状。
An accelerometer measures acceleration around the x, y and z axis: 加速度计测量绕 x、y 和 z
  轴的加速度
In robotics, it is essential in determining the robot position and movement: 在机器人学中，确定机器人的位置和运动至关重要。
In this script, we draw a 3D shape, and control its rotation using the accelerometer: 在这个脚本中，我们绘制一个三维形状，并使用加速度计控制其旋转。
