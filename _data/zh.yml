  Thonny 中创建一个名为 piano.py 的新文件。
connected to an analog 2-axis thumb joystick module, 2 micro servo motors and an OLED display module (SSD1306) on a breadboard: 连接到面包板上的模拟双轴拇指摇杆模块、2个微型伺服电机和一个OLED显示模块（SSD1306）。
to control the angles of both servos using the joystick and display the angles on the OLED display: 使用操纵杆控制两个舵机的角度，并在
  OLED 显示屏上显示角度。
A joystick is often used for navigation in robots, drones, cruise ships and planes: 操纵杆常用于机器人、无人机、游轮和飞机的导航。
In FRC robotics, we use 2 gaming controllers, with 2 joysticks per controller: 在FRC机器人比赛中，我们使用两个游戏控制器，每个控制器有两个操纵杆。
Each joystick includes independent X and Y axis control: 每个操纵杆均包含独立的 X 轴和 Y 轴控制功能
Which  gives us a total of 8 independent axes to control the robot: 这样我们就总共有了8个独立的轴来控制机器人。
In this script, we control the angle of two servos using different axes of the joystick: 在这个脚本中，我们使用操纵杆的不同轴来控制两个舵机的角度。
By pressing the joystick button, we toggle the mode to Sync Angle Mode: 按下操纵杆按钮，即可将模式切换到同步角度模式。
Now we use trigonometry to calculate the angle the joystick lever makes, and set the servos to match this angle: 现在我们利用三角函数计算操纵杆的角度，并将伺服电机调整到与该角度相匹配的程度。
In robotics, we often use advanced mathematics to control various motions: 在机器人学中，我们经常使用高等数学来控制各种运动。
