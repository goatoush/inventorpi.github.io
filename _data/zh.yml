Connect Components: 连接组件
Verify Each Connection: 验证每个连接
Power On: 开机
Introduction - Learn about electronics, breadboards, safety (10-20 min): 简介 - 学习电子学、面包板和安全知识（10-20分钟）
Divide class into 5 teams (one per invention kit) (3-5 min): 将全班分成 5 个小组（每个小组使用一套发明工具包）（3-5
