It is used to dim a phone screen in low light, and brighten it when outdoors under bright sunlight: 它用于在光线较暗的环境下调暗手机屏幕，并在户外阳光强烈时调亮屏幕。
Some TVs use it to dim the display to match the ambient room light, to appear like printed wall art: 有些电视利用这项技术来调暗屏幕，使其与室内环境光线相匹配，看起来就像印刷在墙上的艺术品一样。
