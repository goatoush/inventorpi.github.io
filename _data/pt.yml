A MicroPython code example: Um exemplo de código MicroPython
to blink an onboard LED repeatedly: Fazer um LED integrado piscar repetidamente
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Vamos
  começar com um script simples em MicroPython para controlar o LED integrado no microcontrolador
  Pico
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: Acessamos
  os pinos GPIO (Entrada/Saída de Propósito Geral) usando o objeto Pin da biblioteca
  machine
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): O
  LED integrado pode ser acessado em GP25, ou pelo nome “LED” como Pin(“LED”) ou Pin(25)
We use Pin.OUT to set it as an output pin: Usamos Pin.OUT para configurá-lo como um
  pino de saída
We will use input pins later with sensors: Usaremos pinos de entrada posteriormente
  com sensores
Create a new file in Thonny, with file name blink.py: Crie um novo arquivo no Thonny
  com o nome blink.py
Copy and paste the code below into the file you created: Copie e cole o código abaixo
  no arquivo que você criou
Now let’s add the main loop: Agora vamos adicionar o loop principal
We add a 1 second delay with the sleep(1) statement: Adicionamos um atraso de 1 segundo
  com a instrução sleep(1)
Copy and paste the code below to the end of the blink.py file: Copie e cole o código
  abaixo no final do arquivo blink.py
Congratulations, you have written and run your first MicroPython script: Parabéns,
  você escreveu e executou seu primeiro script MicroPython!
