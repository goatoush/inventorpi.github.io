This is a companion guide to the class experiments kit shown below: Esta es una guía
  complementaria del kit de experimentos de clase que se muestra a continuación
You will use this guide along with the kit to learn to build simple electronic circuits with a Raspberry Pi Pico microcontroller: Utilizarás
  esta guía junto con el kit para aprender a construir circuitos electrónicos sencillos
  con un microcontrolador Raspberry Pi Pi Pico
This is a fun hands-on way to get introduced to electronics, programming and engineering: Esta
  es una forma divertida y práctica de introducirse en la electrónica, la programación
  y la ingeniería
Check your class experiments kit: Revisa tu kit de experimentos de clase
It includes 5 identical invention kits and one additional sensors kit: Incluye 5 kits
  de invención idénticos y un kit de sensores adicional
Before we can start the experiments, we need a way to write and deploy the code to Pico: Antes
  de poder comenzar los experimentos, necesitamos una forma de escribir e implementar
  el código en Pico
To do this, we will install the Thonny app, preferably on all computers, so every student can learn to use it: Para
  ello, instalaremos la aplicación Thonny, preferiblemente en todos los ordenadores,
  para que cada estudiante pueda aprender a usarla
If that is not feasible, we install it on at least one computer per team: Si eso no
  es factible, lo instalamos en al menos una computadora por equipo
If Thonny cannot be installed at all, we can use the alternate method below to run the experiments: Si
  no se puede instalar Thonny, podemos usar el método alternativo que se describe
  a continuación para ejecutar los experimentos
Remembering this will make verifying the pin positions easier: Recordar esto facilitará
  la verificación de las posiciones de los pines
The ground pins also have a square copper shape around the pin on the Pico board to make them easier to recognize: Los
  pines de tierra también tienen una forma cuadrada de cobre alrededor del pin en
  la placa Pico para que sean más fáciles de reconocer
The goal is to help students move from simply learning about technology to actually building technology that solve real problems: El
  objetivo es ayudar a los estudiantes a pasar de simplemente aprender sobre tecnología
  a construir tecnología que resuelva problemas reales
It is targeted towards middle school and primary school teachers and students who want to introduce and learn hands-on STEM: Está
  dirigido a profesores y alumnos de primaria y secundaria que deseen introducir y
  aprender de forma práctica las disciplinas STEM (Ciencia, Tecnología, Ingeniería
  y Matemáticas)
? Students learn basic electronic skills about using a breadboard, connecting sensors,
  motors and controllers, and programming on Raspberry Pi
: Los estudiantes aprenden habilidades electrónicas básicas sobre el uso de una placa
  de prototipos, la conexión de sensores, motores y controladores, y la programación
  en Raspberry Pi
? With an early start, this can unlock their creativity and set them on their path
  to prototype new ideas, identify real world problems, and continue learning new
  skills, experimenting and inventing
: Comenzar pronto puede liberar su creatividad y encaminarlos hacia la creación de
  prototipos de nuevas ideas, la identificación de problemas del mundo real y el aprendizaje
  continuo de nuevas habilidades, la experimentación y la invención
It was truly great to have Utshaho in class: Fue realmente genial tener a Utshaho
  en clase
He was fantastic with the kids, coming prepared with all the necessary materials: Fue
  fantástico con los niños, llegando preparado con todos los materiales necesarios
He provided clear instructions and offered support to the students throughout their activities: Proporcionó
  instrucciones claras y ofreció apoyo a los estudiantes a lo largo de sus actividades
The students were engaged and enjoyed what they were doing: Los estudiantes estaban
  involucrados y disfrutaban de lo que hacían
They were really interested in building different sensors: Estaban muy interesados
  ​​en construir diferentes sensores
loved this lesson: Me encantó esta lección
Teachers can run a one hour workshop with middle school students interested in STEM: Los
  profesores pueden impartir un taller de una hora a estudiantes de secundaria interesados
  ​​en STEM (Ciencia, Tecnología, Ingeniería y Matemáticas)
Each class experiments kit includes 5 identical invention kits and one Additional Sensors Kit: Cada
  kit de experimentos para la clase incluye 5 kits de invención idénticos y un kit
  de sensores adicionales
? There is also a “Get started with MicroPython on Raspberry Pi Pico” book included,
  which is not essential to running the workshop
: También se incluye un libro titulado &quot;Introducción a MicroPython en Raspberry
  Pi Pico&quot;, que no es esencial para impartir el taller
It is available for optional extra reading, if desired: Está disponible como lectura
  adicional opcional, si se desea
Please familiarize yourself with the contents of the invention kit and the Additional Sensors Kit: Por
  favor, familiarícese con el contenido del kit de invención y del kit de sensores
  adicionales
? The Additional Sensors Kit includes reward stickers that you can distribute for
  the best creative ideas, active participation, etc
: El kit de sensores adicionales incluye pegatinas de recompensa que puedes distribuir
  para las mejores ideas creativas, la participación activa, etc
? There are also some tiny NFC nail stickers that light up when brought near a smartphone
  with NFC (often at the back near the top center)
: También existen unas pequeñas pegatinas NFC para uñas que se iluminan al acercarlas
  a un teléfono inteligente con NFC (normalmente en la parte posterior, cerca de la
  parte superior central)
The first step is installing the Thonny app: El primer paso es instalar la aplicación
  Thonny
It is important for the students to learn how breadboard connections work and to be safe: Es
  importante que los estudiantes aprendan cómo funcionan las conexiones de la placa
  de prototipos y que estén seguros
The Additional Sensors Kit includes a breadboard with no backing to show how it works: El
  kit de sensores adicionales incluye una placa de pruebas sin soporte para mostrar
  cómo funciona
? There is a resettable fuse on the breadboard which disconnects the circuit in case
  a student accidentally creates a short circuit on the breadboard
: En la placa de pruebas hay un fusible rearmable que desconecta el circuito en caso
  de que un estudiante cree accidentalmente un cortocircuito en la placa de pruebas
? The students still need to verify all connections before powering on the circuit,
  because incorrect connections to the sensors can cause permanent damage to their
  sensitive electronics, rendering them useless
: Los estudiantes aún deben verificar todas las conexiones antes de encender el circuito,
  ya que las conexiones incorrectas a los sensores pueden causar daños permanentes
  a sus componentes electrónicos sensibles, dejándolos inservibles
? When setting up the connectors, students should disconnect the USB cable from Pico,
  and have multiple students verify the connections before connecting the USB cable
: Al configurar los conectores, los estudiantes deben desconectar el cable USB de
  Pico y hacer que varios estudiantes verifiquen las conexiones antes de conectar
  el cable USB
It is useful to count the pin distance from other used pins on the board: Resulta
  útil contar la distancia entre los pines utilizados en la placa
? Bluetooth advertise and scan should be a fun experiment for the entire class, where
  all the devices synchronize their LED colors to match one advertising device
: La función de publicidad y escaneo por Bluetooth debería ser un experimento divertido
  para toda la clase, donde todos los dispositivos sincronizan los colores de sus
  LED para que coincidan con un dispositivo publicitario
You could direct one team to work on Bluetooth advertise and others to setup Bluetooth scan before time runs out: Podrías
  asignar un equipo para que trabaje en la publicidad Bluetooth y otros para que configuren
  el escaneo Bluetooth antes de que se acabe el tiempo
