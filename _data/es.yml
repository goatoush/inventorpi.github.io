How to Run Experiments with Thonny: Cómo realizar experimentos con Thonny
Launch Thonny App on your computer, if it is not already running: Inicia la aplicación
  Thonny en tu ordenador, si aún no está en ejecución
Read the guide and the code for the experiment on this website and create a new file as described: Lea
  la guía y el código del experimento en este sitio web y cree un nuevo archivo como
  se describe
Connect the components as described before connecting Pico to power supply: Conecte
  los componentes como se describe antes de conectar Pico a la fuente de alimentación
Verify all the connections are to the correct Pins, especially the VCC and GND connections: Verifique
  que todas las conexiones estén en los pines correctos, especialmente las conexiones
  VCC y GND
To end the experiment, disconnect the USB cable from Pico: Para finalizar el experimento,
  desconecte el cable USB de Pico
To select another experiment, repeat the steps above: Para seleccionar otro experimento,
  repita los pasos anteriores
