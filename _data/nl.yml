Introduction - Learn about electronics, breadboards, safety (10-20 min): Inleiding
  - Leer meer over elektronica, breadboards en veiligheid (10-20 min)
Divide class into 5 teams (one per invention kit) (3-5 min): Verdeel de klas in 5
