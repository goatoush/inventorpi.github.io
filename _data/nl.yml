A MicroPython code example: Een voorbeeld van MicroPython-code
running on a Raspberry Pi Pico 2 W microcontroller: draait op een Raspberry Pi Pico
  2W microcontroller
to blink an onboard LED repeatedly: een ingebouwde LED herhaaldelijk laten knipperen
Let’s start with a simple micropython script to control the onboard LED on the Pico microcontroller: Laten
  we beginnen met een eenvoudig MicroPython-script om de ingebouwde LED op de Pico-microcontroller
  aan te sturen
We access the GPIO (General Purpose Input Output) pins by using the Pin object from the machine library: We
  hebben toegang tot de GPIO-pinnen (General Purpose Input Output) door gebruik te
  maken van het Pin-object uit de machinebibliotheek
The onboard LED can be accessed at GP25, or the name “LED” as Pin(“LED”) or Pin(25): De
  ingebouwde LED is toegankelijk via GP25, of via de naam “LED” als Pin(“LED”) of
  Pin(25)
We use Pin.OUT to set it as an output pin: We gebruiken Pin.OUT om het als uitvoerpin
  in te stellen
We will use input pins later with sensors: We zullen de ingangspinnen later gebruiken
  met sensoren
Create a new file in Thonny, with file name blink.py: Maak een nieuw bestand aan in
  Thonny met de bestandsnaam blink.py
Copy and paste the code below into the file you created: Kopieer en plak de onderstaande
  code in het bestand dat je hebt gemaakt
Now let’s add the main loop: Laten we nu de hoofdloop toevoegen
We add a 1 second delay with the sleep(1) statement: We voegen een vertraging van
  1 seconde toe met de sleep(1)-instructie
Copy and paste the code below to the end of the blink.py file: Kopieer en plak de
  onderstaande code aan het einde van het bestand blink.py
If everything worked as expected, you should see an LED on the Raspberry Pi Pico blink on and off repeatedly: Als
  alles naar behoren werkt, zou je een LED op de Raspberry Pi Pico herhaaldelijk moeten
  zien knipperen
Congratulations, you have written and run your first MicroPython script: Gefeliciteerd,
  je hebt je eerste MicroPython-script geschreven en uitgevoerd
