Run random experiments from the list, and present to other teams (20-30 min): Voer
  willekeurige experimenten uit de lijst uit en presenteer de resultaten aan de andere
  teams (20-30 min)
Clean up and pack the kits (5-7 min): Opruimen en de kits inpakken (5-7 min)
? To facilitate running additional workshops in future, students should pack the contents
