<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
        }

        .error-code {
            color: rgba(0, 0, 0, 0.2);
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #212529;
        }

        p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #F31660;
            color: #ffffff;
            padding: 12px 30px;
            font-weight: 600;
            line-height: 1;
            border-radius: 30px;
            transition: 0.25s;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.15);
        }

        .home-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .home-btn:active {
            background-color: rgba(0, 0, 0, 1);
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Please check the URL for typos.</p>
        <a href="/" class="home-btn">Back to Homepage</a>
    </div>

</body>

</html>
