<script>
    const path = window.location.pathname;
    let langCode = window.location.pathname.split("/").at(1);
    let altLanguages = {{ site.languages | jsonify }}.slice(1).map(x => x.code);
    let langUrlPrefix = !langCode || !altLanguages.includes(langCode) ? "" : "/" + langCode;
    window.location.replace(`${langUrlPrefix}/404-page.html`);
</script>
