<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname;
        let langCode = window.location.pathname.split("/").at(1);
        let languages = {{ site.languages | jsonify }}.slice(1).map(x => x.code);
        let langUrlPrefix = !langCode || !languages.includes(langCode) ? "" : "/" + langCode;
        window.location.replace(`${langUrlPrefix}/404-page.html`);
    </script>
  </head>

  <body>
    <h1>Page not found</h1>
  </body>
</html>
