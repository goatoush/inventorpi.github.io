theme: just-the-docs
title: Inventor Pi
description: Making hands-on invention more accessible for teachers and students
url: "https://inventorpi.com"
baseurl: "/inventorpi.github.io"
plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap
logo: "/assets/images/inventor-pi-logo.png"
favicon_ico: "/assets/images/favicon.ico"
brand_color: "#F31660"
back_to_top: true
back_to_top_text: "Back to top"
mermaid:
  version: "12.1.0"
nav_external_links_new_tab: true
nav_external_links:
  - title: Inventor Pi on GitHub
    url: https://github.com/goatoush/inventor-pi
aux_links:
  Get Started ▶:
    - /getting-started/
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
compress_html:
  ignore:
    envs: all
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true
