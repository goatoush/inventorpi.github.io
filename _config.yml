remote_theme: just-the-docs/just-the-docs
title: Inventor Pi
description: Hands-on electronics workshops for schools
url: "https://inventorpi.com"
lang: "en"
locale: "en"
logo: "/assets/images/inventor-pi-logo.webp"
favicon_ico: "/favicon.ico"
brand_color: "#F31660"
plugins:
  - jekyll-remote-theme
exclude:
  - _data
  - firebase.json
  - README.md
  - functions
pdfs:
  - "assets/Inventor Pi - Introduction to Electronics.pdf"
preserve_text:
  - Inventor Pi(, Inc.?)?
bust_cache_patters:
  - '<script src="\/assets\/js\/.+?"'
  - 'const \w+ = ''/assets/.+?'''
  - '<link rel="stylesheet" href="\/assets\/css\/.+?\.css"'
  - '<img\s.*?src=["'']\/assets\/.+?["'']'
languages:
  - code: en
    label: English
    label_en: English
    flag: 🇺🇸 🇬🇧
  - code: fr
    label: Français
    label_en: French
    flag: 🇫🇷 🇬🇳
  - code: es
    label: Español
    label_en: Spanish
    flag: 🇪🇸 🇲🇽
  - code: de
    label: Deutsch
    label_en: German
    flag: 🇩🇪 🇦🇹
  - code: zh
    label: 简体字
    label_en: Chinese (Simplified)
    flag: 🇨🇳 🇸🇬
  - code: zh-TW
    label: 正体字
    label_en: Chinese (Traditional)
    flag: 🇹🇼 🇭🇰
  - code: hi
    label: हिंदी
    label_en: Hindi
    flag: 🇮🇳 🇳🇵
  - code: bn
    label: বাংলা
    label_en: Bangla
    flag: 🇧🇩 🇮🇳
  - code: ar
    rtl: true
    label: عربي
    label_en: Arabic
    flag: 🇸🇦 🇪🇬
  - code: fa
    rtl: true
    label: فارسی
    label_en: Persian
    flag: 🇮🇷 🇦🇫
  - code: ur
    rtl: true
    label: اردو
    label_en: Urdu
    flag: 🇵🇰 🇮🇳
  - code: pt
    label: Português
    label_en: Portuguese
    flag: 🇵🇹 🇧🇷
  - code: ja
    label: 日本語
    label_en: Japanese
    flag: 🇯🇵 🇵🇼
  - code: it
    label: Italiana
    label_en: Italian
    flag: 🇮🇹 🇸🇲
  - code: nl
    label: Nederlands
    label_en: Dutch
    flag: 🇳🇱 🇸🇷
  - code: da
    label: Dansk
    label_en: Danish
    flag: 🇩🇰 🇪🇺
  - code: ru
    label: Русский
    label_en: Russian
    flag: 🇷🇺 🇰🇿
back_to_top: true
back_to_top_text: "Back to top"
mermaid:
  version: "12.1.0"
nav_external_links_new_tab: true
nav_external_links:
  - title: Inventor Pi on GitHub
    url: https://github.com/goatoush/inventor-pi
aux_links:
  Get Started:
    - /getting-started/
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
compress_html:
  ignore:
    envs: all
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true
sass:
  quiet_deps: true
  silence_deprecations: ["import"]
  style: compressed
i18n_text:
  Active:
  Base:
  Planned:
  Here:
  Summary:
  Note:
  Important: